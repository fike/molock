# Default values for molock.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/fike/molock
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
    #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines or set them in values.yaml.
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Molock configuration
config:
  server:
    port: 8080
    workers: 4
    host: "0.0.0.0"
    max_request_size: 10485760

  telemetry:
    enabled: true
    service_name: "molock"
    service_version: "0.2.0"
    # Update this to your OTel collector endpoint in the cluster
    endpoint: "http://otel-collector:4317"
    protocol: "grpc"
    sampling_rate: 1.0
    log_level: "info"
    log_format: "json"
    timeout_seconds: 30
    export_batch_size: 512
    export_timeout_millis: 30000

  endpoints:
    - name: "Health Check"
      method: GET
      path: "/health"
      responses:
        - status: 200
          body: '{"status": "healthy", "timestamp": "{{timestamp}}"}'
          headers:
            Content-Type: application/json

    - name: "Get User"
      method: GET
      path: "/users/:id"
      responses:
        - status: 200
          delay: 50ms
          body: '{"id": "{{id}}", "name": "John Doe", "email": "john@example.com"}'
          headers:
            Content-Type: application/json
            X-Request-ID: "{{request_id}}"
        - status: 404
          condition: "id == 'unknown'"
          body: '{"error": "User not found"}'
          headers:
            Content-Type: application/json
        - status: 500
          probability: 0.01
          body: '{"error": "Internal server error"}'
          headers:
            Content-Type: application/json

env:
  RUST_LOG: "info,molock=debug"
  RUST_LOG_FORMAT: "json"
