n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\n/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\n//! Direct OpenTelemetry API integration for HTTP tracing\n//!\n//! This module provides direct OpenTelemetry API usage to work around limitations\n//! in the tracing-opentelemetry crate, particularly for setting span attributes\n//! with correct semantic convention names.\n\nuse crate::telemetry::attributes;\nuse opentelemetry::trace::{Span as OtelSpan, SpanKind, Status, Tracer, TracerProvider};\nuse opentelemetry::Context;\nuse opentelemetry_sdk::trace::{SdkTracerProvider, Span, Tracer as SdkTracer};\nuse std::sync::Arc;\nuse std::sync::RwLock;\n\nstatic TRACER_PROVIDER: RwLock\u003cOption\u003cArc\u003cSdkTracerProvider\u003e\u003e\u003e = RwLock::new(None);\n\npub fn init_direct_tracer(tracer_provider: Arc\u003cSdkTracerProvider\u003e) {\n    let mut provider = TRACER_PROVIDER.write().unwrap();\n    *provider = Some(tracer_provider);\n}\n\nfn get_tracer() -\u003e Option\u003cSdkTracer\u003e {\n    let provider = TRACER_PROVIDER.read().unwrap();\n    provider.as_ref().map(|p| p.tracer(\"molock-direct\"))\n}\n\n/// Create an HTTP server span using direct OpenTelemetry API.\n///\n/// The `parent_cx` parameter allows linking this span to an upstream trace extracted\n/// from incoming request headers (W3C `traceparent`/`tracestate`). Pass\n/// `\u0026Context::current()` when no parent context is available.\npub fn create_http_server_span(\n    name: \u0026str,\n    method: \u0026str,\n    target: \u0026str,\n    route: \u0026str,\n    parent_cx: \u0026Context,\n) -\u003e Option\u003cSpan\u003e {\n    let tracer = get_tracer()?;\n\n    let span = tracer\n        .span_builder(name.to_string())\n        .with_kind(SpanKind::Server)\n        .with_attributes(vec![\n            attributes::kv::http_method(method),\n            attributes::kv::http_target(target),\n            attributes::kv::http_route(route),\n        ])\n        .start_with_context(\u0026tracer, parent_cx);\n\n    Some(span)\n}\n\n/// Set HTTP response status code on a span using direct OpenTelemetry API\npub fn set_http_response_status_code(span: \u0026mut Span, status: u16) {\n    // Set the correct semantic convention: http.response.status_code\n    span.set_attribute(attributes::kv::http_response_status_code(status));\n\n    // Also set span status based on HTTP status code\n    match status {\n        200..=299 =\u003e span.set_status(Status::Ok),\n        400..=499 =\u003e span.set_status(Status::error(\"Client error\")),\n        500..=599 =\u003e span.set_status(Status::error(\"Server error\")),\n        _ =\u003e span.set_status(Status::Unset),\n    }\n}\n\n/// End a span\npub fn end_span(mut span: Span) {\n    span.end();\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::sync::Mutex;\n\n    // Tests share a global TRACER_PROVIDER, so they must be serialized\n    // to avoid race conditions (e.g., one test setting None while another reads).\n    static TEST_LOCK: Mutex\u003c()\u003e = Mutex::new(());\n\n    #[test]\n    fn test_create_http_server_span_without_initialization() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.write().unwrap();\n            provider.clone()\n        };\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = None;\n        drop(provider);\n\n        let cx = Context::current();\n        let span = create_http_server_span(\n            \"test-span\",\n            \"GET\",\n            \"/test\",\n            \"/test\",\n            \u0026cx,\n        );\n        assert!(span.is_none());\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_get_tracer_without_initialization() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = None;\n        drop(provider);\n\n        let tracer = get_tracer();\n        assert!(tracer.is_none());\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_init_direct_tracer() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let tracer = get_tracer();\n        assert!(tracer.is_some());\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_create_http_server_span_with_initialization() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let cx = Context::current();\n        let span = create_http_server_span(\n            \"http.request\",\n            \"GET\",\n            \"/api/users\",\n            \"/api/users\",\n            \u0026cx,\n        );\n\n        assert!(span.is_some());\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    /// Verify that `create_http_server_span` does not add a redundant `span.kind`\n    /// string attribute. The kind is communicated correctly via `SpanKind::Server`\n    /// on the builder; adding it again as a raw string attribute causes Jaeger to\n    /// display two separate `span.kind` entries for every span.\n    #[test]\n    fn test_create_http_server_span_no_duplicate_span_kind_attribute() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        // Use a noop provider — we only care that the builder is invoked without\n        // the extra attribute; the span itself doesn't need to be exported.\n        let tracer_provider = SdkTracerProvider::builder().build();\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let cx = Context::current();\n        // If the builder still included `span.kind` as an attribute, the span\n        // would carry it twice when exported. The test ensures the function compiles\n        // and executes without panicking — the absence of the attribute is enforced\n        // by code inspection of the `with_attributes` list above.\n        let span = create_http_server_span(\n            \"http.request\",\n            \"GET\",\n            \"/test\",\n            \"/test\",\n            \u0026cx,\n        );\n        assert!(span.is_some());\n        end_span(span.unwrap());\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    /// Verify that a span created with a non-empty parent context correctly links\n    /// to the parent. This simulates receiving an upstream `traceparent` header.\n    #[test]\n    fn test_create_http_server_span_with_parent_context() {\n        use opentelemetry::trace::{SpanContext, SpanId, TraceFlags, TraceId, TraceState};\n\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        // Build a synthetic parent SpanContext (as if extracted from traceparent header).\n        let parent_span_ctx = SpanContext::new(\n            TraceId::from_hex(\"4bf92f3577b34da6a3ce929d0e0e4736\").unwrap(),\n            SpanId::from_hex(\"00f067aa0ba902b7\").unwrap(),\n            TraceFlags::SAMPLED,\n            true,\n            TraceState::default(),\n        );\n\n        use opentelemetry::trace::TraceContextExt;\n        let parent_cx = Context::current().with_remote_span_context(parent_span_ctx.clone());\n\n        let span = create_http_server_span(\n            \"http.request\",\n            \"GET\",\n            \"/api/resource\",\n            \"/api/resource\",\n            \u0026parent_cx,\n        );\n\n        assert!(\n            span.is_some(),\n            \"span should be created with a parent context\"\n        );\n\n        // The child span must share the same TraceId as the parent.\n        let child_span = span.unwrap();\n        let child_ctx = child_span.span_context();\n        assert_eq!(\n            child_ctx.trace_id(),\n            parent_span_ctx.trace_id(),\n            \"child span TraceId must match the parent TraceId for correct propagation\"\n        );\n\n        end_span(child_span);\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_set_http_response_status_code() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let tracer = get_tracer().unwrap();\n        let mut span = tracer.start(\"test-span\");\n\n        set_http_response_status_code(\u0026mut span, 200);\n\n        let mut span = tracer.start(\"test-span-404\");\n        set_http_response_status_code(\u0026mut span, 404);\n\n        let mut span = tracer.start(\"test-span-500\");\n        set_http_response_status_code(\u0026mut span, 500);\n\n        let mut span = tracer.start(\"test-span-300\");\n        set_http_response_status_code(\u0026mut span, 300);\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_end_span() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let tracer = get_tracer().unwrap();\n        let span = tracer.start(\"test-span\");\n\n        end_span(span);\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_create_http_server_span_with_different_methods() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let methods = vec![\"GET\", \"POST\", \"PUT\", \"DELETE\", \"PATCH\", \"HEAD\"];\n        let cx = Context::current();\n\n        for method in methods {\n            let span = create_http_server_span(\n                \"http.request\",\n                method,\n                \"/api/test\",\n                \"/api/test\",\n                \u0026cx,\n            );\n\n            assert!(span.is_some());\n            end_span(span.unwrap());\n        }\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_create_http_server_span_with_different_paths() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let paths = vec![\n            \"/\",\n            \"/api/users\",\n            \"/api/users/123\",\n            \"/api/orders?page=1\u0026limit=10\",\n            \"/api/search?q=test%20query\",\n        ];\n        let cx = Context::current();\n\n        for path in paths {\n            let span = create_http_server_span(\n                \"http.request\",\n                \"GET\",\n                path,\n                path,\n                \u0026cx,\n            );\n\n            assert!(span.is_some());\n            end_span(span.unwrap());\n        }\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n\n    #[test]\n    fn test_semantic_convention_usage() {\n        let _guard = TEST_LOCK.lock().unwrap();\n\n        let original_provider = {\n            let provider = TRACER_PROVIDER.read().unwrap();\n            provider.clone()\n        };\n\n        let tracer_provider = SdkTracerProvider::builder().build();\n\n        init_direct_tracer(Arc::new(tracer_provider));\n\n        let cx = Context::current();\n        let span = create_http_server_span(\n            \"http.request\",\n            \"POST\",\n            \"/api/users\",\n            \"/api/users\",\n            \u0026cx,\n        )\n        .unwrap();\n\n        end_span(span);\n\n        let mut provider = TRACER_PROVIDER.write().unwrap();\n        *provider = original_provider;\n    }\n}\n","traces":[{"line":48,"address":[],"length":0,"stats":{"Line":10}},{"line":49,"address":[],"length":0,"stats":{"Line":40}},{"line":50,"address":[],"length":0,"stats":{"Line":20}},{"line":53,"address":[],"length":0,"stats":{"Line":32}},{"line":54,"address":[],"length":0,"stats":{"Line":128}},{"line":55,"address":[],"length":0,"stats":{"Line":124}},{"line":63,"address":[],"length":0,"stats":{"Line":28}},{"line":70,"address":[],"length":0,"stats":{"Line":56}},{"line":72,"address":[],"length":0,"stats":{"Line":54}},{"line":73,"address":[],"length":0,"stats":{"Line":81}},{"line":74,"address":[],"length":0,"stats":{"Line":54}},{"line":75,"address":[],"length":0,"stats":{"Line":54}},{"line":76,"address":[],"length":0,"stats":{"Line":54}},{"line":77,"address":[],"length":0,"stats":{"Line":54}},{"line":78,"address":[],"length":0,"stats":{"Line":54}},{"line":80,"address":[],"length":0,"stats":{"Line":81}},{"line":82,"address":[],"length":0,"stats":{"Line":27}},{"line":86,"address":[],"length":0,"stats":{"Line":16}},{"line":88,"address":[],"length":0,"stats":{"Line":64}},{"line":91,"address":[],"length":0,"stats":{"Line":16}},{"line":92,"address":[],"length":0,"stats":{"Line":52}},{"line":93,"address":[],"length":0,"stats":{"Line":6}},{"line":94,"address":[],"length":0,"stats":{"Line":8}},{"line":95,"address":[],"length":0,"stats":{"Line":3}},{"line":100,"address":[],"length":0,"stats":{"Line":27}},{"line":101,"address":[],"length":0,"stats":{"Line":54}}],"covered":26,"coverable":26},{"path":["/","Users","fernandoike","projects","pets","molock","src","telemetry","tracer.rs"],"content":"/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\nuse crate::config::TelemetryConfig;\nuse crate::telemetry::attributes;\nuse crate::telemetry::otel_direct;\nuse actix_web::dev::{Service, ServiceRequest, ServiceResponse, Transform};\nuse futures::future::LocalBoxFuture;\nuse opentelemetry::KeyValue;\nuse opentelemetry_otlp::WithExportConfig;\n\nuse std::future::ready;\nuse std::rc::Rc;\nuse std::sync::Arc;\nuse std::task::{Context as TaskContext, Poll};\nuse tracing::{info, warn};\nuse tracing_subscriber::layer::SubscriberExt;\nuse tracing_subscriber::util::SubscriberInitExt;\nuse tracing_subscriber::Registry;\n\n#[cfg(feature = \"otel\")]\nuse opentelemetry_sdk::logs::SdkLoggerProvider;\n#[cfg(feature = \"otel\")]\nuse opentelemetry_sdk::trace::SdkTracerProvider;\n#[cfg(feature = \"otel\")]\nuse opentelemetry_sdk::trace::Span as SdkSpan;\n\n#[cfg(feature = \"otel\")]\nstruct ActixHeaderExtractor\u003c'a\u003e(\u0026'a actix_web::http::header::HeaderMap);\n\n#[cfg(feature = \"otel\")]\nimpl opentelemetry::propagation::Extractor for ActixHeaderExtractor\u003c'_\u003e {\n    fn get(\u0026self, key: \u0026str) -\u003e Option\u003c\u0026str\u003e {\n        self.0.get(key).and_then(|v| v.to_str().ok())\n    }\n\n    fn keys(\u0026self) -\u003e Vec\u003c\u0026str\u003e {\n        self.0.keys().map(|k| k.as_str()).collect()\n    }\n}\n\n#[cfg(feature = \"otel\")]\npub async fn init_tracing(config: \u0026TelemetryConfig) -\u003e anyhow::Result\u003c()\u003e {\n    if !config.enabled {\n        info!(\"Tracing is disabled\");\n        return Ok(());\n    }\n\n    if tracing::dispatcher::has_been_set() {\n        info!(\"A tracing subscriber is already set, skipping initialization\");\n        return Ok(());\n    }\n\n    let resource = build_resource(config);\n    let tracer_provider = build_tracer_provider(config, resource.clone())?;\n    let logger_provider = build_logger_provider(config, resource)?;\n\n    init_global_settings(tracer_provider.clone());\n\n    setup_subscriber(config, \u0026logger_provider);\n\n    info!(\"OpenTelemetry tracing initialized successfully\");\n    Ok(())\n}\n\n#[cfg(feature = \"otel\")]\nfn build_resource(config: \u0026TelemetryConfig) -\u003e opentelemetry_sdk::Resource {\n    opentelemetry_sdk::Resource::builder()\n        .with_attributes(vec![\n            KeyValue::new(\"service.name\", config.service_name.clone()),\n            KeyValue::new(\"service.version\", config.service_version.clone()),\n        ])\n        .build()\n}\n\n#[cfg(feature = \"otel\")]\nfn build_tracer_provider(\n    config: \u0026TelemetryConfig,\n    resource: opentelemetry_sdk::Resource,\n) -\u003e anyhow::Result\u003cSdkTracerProvider\u003e {\n    let protocol = config.protocol.to_lowercase();\n    let exporter = match protocol.as_str() {\n        \"http\" =\u003e {\n            let endpoint = format_endpoint(\u0026config.endpoint, \"v1/traces\");\n            opentelemetry_otlp::SpanExporter::builder()\n                .with_http()\n                .with_endpoint(endpoint)\n                .with_timeout(std::time::Duration::from_secs(config.timeout_seconds))\n                .build()\n        }\n        _ =\u003e {\n            if protocol != \"grpc\" {\n                warn!(\"Unknown protocol '{}', defaulting to gRPC\", protocol);\n            }\n            opentelemetry_otlp::SpanExporter::builder()\n                .with_tonic()\n                .with_endpoint(\u0026config.endpoint)\n                .with_timeout(std::time::Duration::from_secs(config.timeout_seconds))\n                .build()\n        }\n    }\n    .map_err(|e| anyhow::anyhow!(\"OpenTelemetry span exporter build failed: {e}\"))?;\n\n    Ok(SdkTracerProvider::builder()\n        .with_batch_exporter(exporter)\n        .with_resource(resource)\n        .with_sampler(opentelemetry_sdk::trace::Sampler::ParentBased(Box::new(\n            opentelemetry_sdk::trace::Sampler::TraceIdRatioBased(config.sampling_rate),\n        )))\n        .build())\n}\n\n#[cfg(feature = \"otel\")]\nfn build_logger_provider(\n    config: \u0026TelemetryConfig,\n    resource: opentelemetry_sdk::Resource,\n) -\u003e anyhow::Result\u003cSdkLoggerProvider\u003e {\n    let protocol = config.protocol.to_lowercase();\n    let exporter = match protocol.as_str() {\n        \"http\" =\u003e {\n            let endpoint = format_endpoint(\u0026config.endpoint, \"v1/logs\");\n            opentelemetry_otlp::LogExporter::builder()\n                .with_http()\n                .with_endpoint(endpoint)\n                .with_timeout(std::time::Duration::from_secs(config.timeout_seconds))\n                .build()\n        }\n        _ =\u003e opentelemetry_otlp::LogExporter::builder()\n            .with_tonic()\n            .with_endpoint(\u0026config.endpoint)\n            .with_timeout(std::time::Duration::from_secs(config.timeout_seconds))\n            .build(),\n    }\n    .map_err(|e| anyhow::anyhow!(\"OpenTelemetry log exporter build failed: {e}\"))?;\n\n    Ok(SdkLoggerProvider::builder()\n        .with_batch_exporter(exporter)\n        .with_resource(resource)\n        .build())\n}\n\n#[cfg(feature = \"otel\")]\nfn format_endpoint(base: \u0026str, path: \u0026str) -\u003e String {\n    if base.contains(path) {\n        base.to_string()\n    } else if base.ends_with('/') {\n        format!(\"{base}{path}\")\n    } else {\n        format!(\"{base}/{path}\")\n    }\n}\n\n#[cfg(feature = \"otel\")]\nfn init_global_settings(tracer_provider: SdkTracerProvider) {\n    opentelemetry::global::set_tracer_provider(tracer_provider.clone());\n    opentelemetry::global::set_text_map_propagator(\n        opentelemetry_sdk::propagation::TraceContextPropagator::new(),\n    );\n    otel_direct::init_direct_tracer(Arc::new(tracer_provider));\n}\n\n#[cfg(feature = \"otel\")]\nfn setup_subscriber(config: \u0026TelemetryConfig, logger_provider: \u0026SdkLoggerProvider) {\n    let tracer = opentelemetry::global::tracer(\"molock\");\n    let telemetry_layer = tracing_opentelemetry::layer().with_tracer(tracer);\n    let otel_log_layer =\n        opentelemetry_appender_tracing::layer::OpenTelemetryTracingBridge::new(logger_provider);\n\n    let subscriber = Registry::default()\n        .with(tracing_subscriber::EnvFilter::new(\u0026config.log_level))\n        .with(telemetry_layer)\n        .with(otel_log_layer);\n\n    if config.log_format == \"json\" {\n        let _ = subscriber\n            .with(tracing_subscriber::fmt::layer().json())\n            .try_init();\n    } else {\n        let _ = subscriber.with(tracing_subscriber::fmt::layer()).try_init();\n    }\n}\n\n#[cfg(not(feature = \"otel\"))]\npub async fn init_tracing(config: \u0026TelemetryConfig) -\u003e anyhow::Result\u003c()\u003e {\n    if !config.enabled {\n        info!(\"Tracing is disabled\");\n        return Ok(());\n    }\n\n    if tracing::dispatcher::has_been_set() {\n        info!(\"A tracing subscriber is already set, skipping initialization\");\n        return Ok(());\n    }\n\n    let subscriber =\n        Registry::default().with(tracing_subscriber::EnvFilter::new(\u0026config.log_level));\n\n    if config.log_format == \"json\" {\n        let _ = subscriber\n            .with(tracing_subscriber::fmt::layer().json())\n            .try_init();\n    } else {\n        let _ = subscriber.with(tracing_subscriber::fmt::layer()).try_init();\n    }\n\n    info!(\"Basic tracing initialized successfully\");\n    Ok(())\n}\n\npub fn tracing_middleware() -\u003e TracingMiddleware {\n    TracingMiddleware\n}\n\npub struct TracingMiddleware;\n\nimpl\u003cS, B\u003e Transform\u003cS, ServiceRequest\u003e for TracingMiddleware\nwhere\n    S: Service\u003cServiceRequest, Response = ServiceResponse\u003cB\u003e, Error = actix_web::Error\u003e + 'static,\n    S::Future: 'static,\n    B: 'static,\n{\n    type Response = ServiceResponse\u003cB\u003e;\n    type Error = actix_web::Error;\n    type Transform = TracingMiddlewareService\u003cS\u003e;\n    type InitError = ();\n    type Future = std::future::Ready\u003cResult\u003cSelf::Transform, Self::InitError\u003e\u003e;\n\n    fn new_transform(\u0026self, service: S) -\u003e Self::Future {\n        ready(Ok(TracingMiddlewareService {\n            service: Rc::new(service),\n        }))\n    }\n}\n\npub struct TracingMiddlewareService\u003cS\u003e {\n    service: Rc\u003cS\u003e,\n}\n\nimpl\u003cS, B\u003e Service\u003cServiceRequest\u003e for TracingMiddlewareService\u003cS\u003e\nwhere\n    S: Service\u003cServiceRequest, Response = ServiceResponse\u003cB\u003e, Error = actix_web::Error\u003e + 'static,\n    S::Future: 'static,\n    B: 'static,\n{\n    type Response = ServiceResponse\u003cB\u003e;\n    type Error = actix_web::Error;\n    type Future = LocalBoxFuture\u003c'static, Result\u003cSelf::Response, Self::Error\u003e\u003e;\n\n    fn poll_ready(\u0026self, cx: \u0026mut TaskContext\u003c'_\u003e) -\u003e Poll\u003cResult\u003c(), Self::Error\u003e\u003e {\n        self.service.poll_ready(cx)\n    }\n\n    fn call(\u0026self, req: ServiceRequest) -\u003e Self::Future {\n        let service = self.service.clone();\n        let method = req.method().as_str();\n        let path = req.path();\n\n        #[cfg(not(feature = \"otel\"))]\n        {\n            let method = method.to_string();\n            let path = path.to_string();\n            Box::pin(async move {\n                let span = tracing::info_span!(\n                    \"http.request\",\n                    http.method = %method,\n                    http.target = %path,\n                    http.route = %path,\n                );\n                let _guard = span.enter();\n                let response = service.call(req).await?;\n                log_response_status(response.status().as_u16());\n                Ok(response)\n            })\n        }\n\n        #[cfg(feature = \"otel\")]\n        {\n            use opentelemetry::propagation::TextMapPropagator;\n            use opentelemetry_sdk::propagation::TraceContextPropagator;\n\n            let propagator = TraceContextPropagator::new();\n            let parent_cx = propagator.extract(\u0026ActixHeaderExtractor(req.headers()));\n\n            let method = method.to_string();\n            let path = path.to_string();\n\n            Box::pin(async move {\n                let span_result = otel_direct::create_http_server_span(\n                    \"http.request\",\n                    \u0026method,\n                    \u0026path,\n                    \u0026path,\n                    \u0026parent_cx,\n                );\n\n                match span_result {\n                    Some(span) =\u003e {\n                        process_otel_request(service, req, span, parent_cx, \u0026method, \u0026path).await\n                    }\n                    None =\u003e process_fallback_request(service, req, parent_cx, \u0026method, \u0026path).await,\n                }\n            })\n        }\n    }\n}\n\n#[cfg(feature = \"otel\")]\nasync fn process_otel_request\u003cS, B\u003e(\n    service: Rc\u003cS\u003e,\n    req: ServiceRequest,\n    mut direct_span: SdkSpan,\n    parent_cx: opentelemetry::Context,\n    method: \u0026str,\n    path: \u0026str,\n) -\u003e Result\u003cServiceResponse\u003cB\u003e, actix_web::Error\u003e\nwhere\n    S: Service\u003cServiceRequest, Response = ServiceResponse\u003cB\u003e, Error = actix_web::Error\u003e,\n    B: 'static,\n{\n    use opentelemetry::trace::Span as _;\n    use opentelemetry::trace::TraceContextExt as _;\n    use tracing_opentelemetry::OpenTelemetrySpanExt;\n\n    let cx = parent_cx.with_remote_span_context(direct_span.span_context().clone());\n\n    let tracing_span = tracing::info_span!(\n        \"http.request\",\n        http.method = %method,\n        http.target = %path,\n        http.route = %path,\n    );\n    let _ = tracing_span.set_parent(cx);\n\n    let response = {\n        let _guard = tracing_span.enter();\n        service.call(req).await?\n    };\n\n    let status = response.status().as_u16();\n    otel_direct::set_http_response_status_code(\u0026mut direct_span, status);\n    otel_direct::end_span(direct_span);\n\n    let _guard = tracing_span.enter();\n    log_response_status(status);\n\n    Ok(response)\n}\n\n#[cfg(feature = \"otel\")]\nasync fn process_fallback_request\u003cS, B\u003e(\n    service: Rc\u003cS\u003e,\n    req: ServiceRequest,\n    parent_cx: opentelemetry::Context,\n    method: \u0026str,\n    path: \u0026str,\n) -\u003e Result\u003cServiceResponse\u003cB\u003e, actix_web::Error\u003e\nwhere\n    S: Service\u003cServiceRequest, Response = ServiceResponse\u003cB\u003e, Error = actix_web::Error\u003e,\n    B: 'static,\n{\n    use tracing_opentelemetry::OpenTelemetrySpanExt;\n\n    let span = tracing::span!(\n        tracing::Level::INFO,\n        \"http.request\",\n        http.method = %method,\n        http.target = %path,\n        http.route = %path,\n        span.kind = \"server\",\n    );\n    let _ = span.set_parent(parent_cx);\n\n    let _guard = span.enter();\n    let response = service.call(req).await?;\n    let status = response.status().as_u16();\n\n    span.record(attributes::http::RESPONSE_STATUS_CODE, status);\n    log_response_status(status);\n\n    Ok(response)\n}\n\nfn log_response_status(status: u16) {\n    if (200..300).contains(\u0026status) {\n        tracing::info!(\"Request successful\");\n    } else if (300..400).contains(\u0026status) {\n        tracing::info!(\"Redirection\");\n    } else if (400..500).contains(\u0026status) {\n        tracing::warn!(\"Client error\");\n    } else if status \u003e= 500 {\n        tracing::error!(\"Server error\");\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use actix_web::test;\n    use actix_web::web;\n    use actix_web::App;\n    use actix_web::HttpResponse;\n\n    #[actix_web::test]\n    async fn test_tracing_middleware() {\n        let app = test::init_service(App::new().wrap(tracing_middleware()).route(\n            \"/test\",\n            web::get().to(|| async { HttpResponse::Ok().finish() }),\n        ))\n        .await;\n\n        let req = test::TestRequest::get().uri(\"/test\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_eq!(resp.status(), 200);\n    }\n\n    #[actix_web::test]\n    async fn test_tracing_middleware_with_different_methods() {\n        let app = test::init_service(\n            App::new()\n                .wrap(tracing_middleware())\n                .route(\n                    \"/test\",\n                    web::get().to(|| async { HttpResponse::Ok().finish() }),\n                )\n                .route(\n                    \"/test\",\n                    web::post().to(|| async { HttpResponse::Created().finish() }),\n                )\n                .route(\n                    \"/test\",\n                    web::put().to(|| async { HttpResponse::Ok().finish() }),\n                )\n                .route(\n                    \"/test\",\n                    web::delete().to(|| async { HttpResponse::NoContent().finish() }),\n                ),\n        )\n        .await;\n\n        let get_req = test::TestRequest::get().uri(\"/test\").to_request();\n        let get_resp = test::call_service(\u0026app, get_req).await;\n        assert_eq!(get_resp.status(), 200);\n\n        let post_req = test::TestRequest::post().uri(\"/test\").to_request();\n        let post_resp = test::call_service(\u0026app, post_req).await;\n        assert_eq!(post_resp.status(), 201);\n\n        let put_req = test::TestRequest::put().uri(\"/test\").to_request();\n        let put_resp = test::call_service(\u0026app, put_req).await;\n        assert_eq!(put_resp.status(), 200);\n\n        let delete_req = test::TestRequest::delete().uri(\"/test\").to_request();\n        let delete_resp = test::call_service(\u0026app, delete_req).await;\n        assert_eq!(delete_resp.status(), 204);\n    }\n\n    #[actix_web::test]\n    async fn test_tracing_middleware_with_different_paths() {\n        let app = test::init_service(\n            App::new()\n                .wrap(tracing_middleware())\n                .route(\n                    \"/api/users\",\n                    web::get().to(|| async { HttpResponse::Ok().finish() }),\n                )\n                .route(\n                    \"/api/users/{id}\",\n                    web::get().to(|| async { HttpResponse::Ok().finish() }),\n                )\n                .route(\n                    \"/api/orders\",\n                    web::get().to(|| async { HttpResponse::Ok().finish() }),\n                ),\n        )\n        .await;\n\n        let req1 = test::TestRequest::get().uri(\"/api/users\").to_request();\n        let resp1 = test::call_service(\u0026app, req1).await;\n        assert_eq!(resp1.status(), 200);\n\n        let req2 = test::TestRequest::get().uri(\"/api/users/123\").to_request();\n        let resp2 = test::call_service(\u0026app, req2).await;\n        assert_eq!(resp2.status(), 200);\n\n        let req3 = test::TestRequest::get().uri(\"/api/orders\").to_request();\n        let resp3 = test::call_service(\u0026app, req3).await;\n        assert_eq!(resp3.status(), 200);\n    }\n\n    #[actix_web::test]\n    async fn test_tracing_middleware_with_error_status() {\n        let app = test::init_service(App::new().wrap(tracing_middleware()).route(\n            \"/error\",\n            web::get().to(|| async { HttpResponse::InternalServerError().finish() }),\n        ))\n        .await;\n\n        let req = test::TestRequest::get().uri(\"/error\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_eq!(resp.status(), 500);\n    }\n\n    #[actix_web::test]\n    async fn test_tracing_middleware_single_span_per_request() {\n        let app = test::init_service(App::new().wrap(tracing_middleware()).route(\n            \"/test\",\n            web::get().to(|| async { HttpResponse::Ok().finish() }),\n        ))\n        .await;\n\n        let req = test::TestRequest::get().uri(\"/test\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_eq!(resp.status(), 200);\n    }\n\n    #[actix_web::test]\n    async fn test_tracing_middleware_with_query_params() {\n        let app = test::init_service(App::new().wrap(tracing_middleware()).route(\n            \"/test\",\n            web::get().to(|| async { HttpResponse::Ok().finish() }),\n        ))\n        .await;\n\n        let req = test::TestRequest::get().uri(\"/test?foo=bar\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_eq!(resp.status(), 200);\n    }\n\n    #[actix_web::test]\n    async fn test_tracing_middleware_without_otel() {\n        // Ensure telemetry is not initialized or use a way to mock it\n        let app = test::init_service(\n            App::new()\n                .wrap(tracing_middleware())\n                .route(\"/test\", web::get().to(|| async { HttpResponse::Ok().finish() })),\n        )\n        .await;\n\n        let req = test::TestRequest::get().uri(\"/test\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_eq!(resp.status(), 200);\n    }\n\n    #[tokio::test]\n    async fn test_init_tra     config: PathBuf,\n\n    #[arg(long, default_value = \"false\")]\n    hot_reload: bool,\n}\n\n#[tokio::main]\nasync fn main() -\u003e anyhow::Result\u003c()\u003e {\n    let args = Args::parse();\n    run(args).await\n}\n\nasync fn run(args: Args) -\u003e anyhow::Result\u003c()\u003e {\n    let config = ConfigLoader::from_file(\u0026args.config)\n        .with_context(|| format!(\"Failed to load config from {:?}\", args.config))?;\n\n    init_telemetry(\u0026config.telemetry).await?;\n\n    let rule_engine = Arc::new(RuleEngine::new(config.endpoints.clone()));\n    let rule_engine_swap = Arc::new(ArcSwap::from(rule_engine.clone()));\n\n    if args.hot_reload {\n        start_hot_reload(\u0026args.config, rule_engine_swap.clone()).await?;\n    }\n\n    let server = run_server(config, rule_engine).await?;\n\n    info!(\"Molock server is running\");\n    info!(\"Press Ctrl+C to shutdown\");\n\n    let server_handle = server.handle();\n    tokio::select! {\n        _ = server =\u003e {\n            info!(\"Server stopped\");\n        }\n        _ = shutdown_signal() =\u003e {\n            info!(\"Shutdown signal received\");\n            server_handle.stop(true).await;\n            info!(\"Server shutdown complete\");\n        }\n    }\n\n    shutdown_telemetry().await;\n\n    Ok(())\n}\n\n#[cfg(feature = \"hot-reload\")]\nasync fn start_hot_reload(\n    config_path: \u0026PathBuf,\n    rule_engine_swap: Arc\u003cArcSwap\u003cRuleEngine\u003e\u003e,\n) -\u003e anyhow::Result\u003c()\u003e {\n    use notify::{RecommendedWatcher, RecursiveMode, Watcher};\n    use std::sync::mpsc;\n    use std::time::Duration;\n\n    let (tx, rx) = mpsc::channel();\n    let mut watcher: RecommendedWatcher = Watcher::new(tx, notify::Config::default())?;\n\n    watcher.watch(config_path, RecursiveMode::NonRecursive)?;\n\n    let config_path = config_path.clone();\n    tokio::spawn(async move {\n        while let Ok(Ok(event)) = rx.recv() {\n            match event {\n                notify::Event {\n                    kind: notify::EventKind::Modify(_),\n                    paths,\n                    ..\n                } =\u003e {\n                    if paths.iter().any(|p| p == \u0026config_path) {\n                        info!(\"Configuration file modified, reloading...\");\n                        match ConfigLoader::from_file(\u0026config_path) {\n                            Ok(new_config) =\u003e {\n                                let new_engine = Arc::new(RuleEngine::new(new_config.endpoints));\n                                rule_engine_swap.store(new_engine);\n                                info!(\"Configuration reloaded successfully\");\n                            }\n                            Err(e) =\u003e {\n                                tracing::error!(\"Failed to reload configuration: {}\", e);\n                            }\n                        }\n                    }\n                }\n                _ =\u003e {}\n            }\n        }\n    });\n\n    Ok(())\n}\n\n#[cfg(not(feature = \"hot-reload\"))]\nasync fn start_hot_reload(\n    _config_path: \u0026PathBuf,\n    _rule_engine_swap: Arc\u003cArcSwap\u003cRuleEngine\u003e\u003e,\n) -\u003e anyhow::Result\u003c()\u003e {\n    info!(\"Hot reload feature is not enabled\");\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs::File;\n    use std::io::Write;\n    use tempfile::tempdir;\n\n    #[tokio::test]\n    async fn test_run_invalid_config() {\n        let dir = tempdir().unwrap();\n        let config_path = dir.path().join(\"invalid.yaml\");\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"invalid yaml\").unwrap();\n\n        let args = Args {\n            config: config_path,\n            hot_reload: false,\n        };\n\n        let result = run(args).await;\n        assert!(result.is_err());\n    }\n\n    #[tokio::test]\n    async fn test_run_success_shutdown() {\n        let dir = tempdir().unwrap();\n        let config_path = dir.path().join(\"config.yaml\");\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"server:\\n  host: 127.0.0.1\\n  port: 0\\n  workers: 1\\n  max_request_size: 1048576\\nendpoints: []\\ntelemetry:\\n  enabled: true\\n  endpoint: http://localhost:4317\\n  protocol: grpc\").unwrap();\n\n        let args = Args {\n            config: config_path,\n            hot_reload: false,\n        };\n\n        // This will at least cover the telemetry init and server creation\n        let _ = run(args).await;\n    }\n\n    #[tokio::test]\n    async fn test_start_hot_reload_change() {\n        let dir = tempdir().unwrap();\n        let config_path = dir.path().join(\"config.yaml\");\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"server:\\n  host: 127.0.0.1\\n  port: 0\\n  workers: 1\\n  max_request_size: 1048576\\nendpoints: []\\ntelemetry:\\n  enabled: false\").unwrap();\n\n        let rule_engine = Arc::new(RuleEngine::new(vec![]));\n        let rule_engine_swap = Arc::new(ArcSwap::from(rule_engine));\n\n        let _ = start_hot_reload(\u0026config_path, rule_engine_swap.clone()).await;\n        \n        // Give watcher some time to start\n        tokio::time::sleep(tokio::time::Duration::from_millis(200)).await;\n\n        // Trigger change\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"server:\\n  host: 127.0.0.1\\n  port: 0\\n  workers: 1\\n  max_request_size: 1048576\\nendpoints: []\\ntelemetry:\\n  enabled: false\").unwrap();\n        file.flush().unwrap();\n        drop(file);\n\n        // Give some time for event to be processed\n        tokio::time::sleep(tokio::time::Duration::from_millis(1000)).await;\n    }\n}\n","traces":[{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":4}},{"line":62,"address":[],"length":0,"stats":{"Line":4}},{"line":63,"address":[],"length":0,"stats":{"Line":6}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[],"length":0,"stats":{"Line":0}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":86,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":0}},{"line":91,"address":[],"length":0,"stats":{"Line":0}},{"line":93,"address":[],"length":0,"stats":{"Line":0}},{"line":97,"address":[],"length":0,"stats":{"Line":1}},{"line":105,"address":[],"length":0,"stats":{"Line":3}},{"line":106,"address":[],"length":0,"stats":{"Line":5}},{"line":108,"address":[],"length":0,"stats":{"Line":4}},{"line":110,"address":[],"length":0,"stats":{"Line":3}},{"line":111,"address":[],"length":0,"stats":{"Line":2}},{"line":112,"address":[],"length":0,"stats":{"Line":2}},{"line":113,"address":[],"length":0,"stats":{"Line":0}},{"line":116,"address":[],"length":0,"stats":{"Line":0}},{"line":119,"address":[],"length":0,"stats":{"Line":0}},{"line":120,"address":[],"length":0,"stats":{"Line":0}},{"line":121,"address":[],"length":0,"stats":{"Line":0}},{"line":122,"address":[],"length":0,"stats":{"Line":0}},{"line":123,"address":[],"length":0,"stats":{"Line":0}},{"line":124,"address":[],"length":0,"stats":{"Line":0}},{"line":125,"address":[],"length":0,"stats":{"Line":0}},{"line":127,"address":[],"length":0,"stats":{"Line":0}},{"line":128,"address":[],"length":0,"stats":{"Line":0}},{"line":133,"address":[],"length":0,"stats":{"Line":0}},{"line":138,"address":[],"length":0,"stats":{"Line":1}}],"covered":11,"coverable":44},{"path":["/","Users","fernandoike","projects","pets","molock","src","rules","executor.rs"],"content":"/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\n/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\nuse crate::config::{Endpoint, Response};\nuse crate::rules::state::StateManager;\nuse crate::rules::{ExecutionContext, RuleResponse};\nuse anyhow::Context;\nuse rand::Rng;\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tracing::info;\n\n#[derive(Clone)]\npub struct ResponseExecutor {\n    state_manager: Arc\u003cStateManager\u003e,\n}\n\nimpl ResponseExecutor {\n    pub fn new(state_manager: Arc\u003cStateManager\u003e) -\u003e Self {\n        Self { state_manager }\n    }\n\n    pub async fn execute(\n        \u0026self,\n        endpoint: \u0026Endpoint,\n        context: \u0026ExecutionContext,\n    ) -\u003e anyhow::Result\u003cRuleResponse\u003e {\n        info!(\n            endpoint = %endpoint.name,\n            method = %context.method,\n            path = %context.path,\n            \"Executing endpoint\"\n        );\n\n        let state_key = if endpoint.stateful {\n            let key = endpoint\n                .state_key\n                .as_deref()\n                .unwrap_or(\"client_ip\")\n                .to_string();\n\n            match key.as_str() {\n                \"client_ip\" =\u003e context.client_ip.clone(),\n                _ =\u003e {\n                    let key_lower = key.to_lowercase();\n                    if let Some(value) = context.headers.get(\u0026key_lower) {\n                        value.clone()\n                    } else {\n                        context.client_ip.clone()\n                    }\n                }\n            }\n        } else {\n            \"\".to_string()\n        };\n\n        if endpoint.stateful \u0026\u0026 !state_key.is_empty() {\n            self.state_manager.increment_count(\u0026state_key);\n        }\n\n        let request_count = if endpoint.stateful \u0026\u0026 !state_key.is_empty() {\n            self.state_manager.get_count(\u0026state_key)\n        } else {\n            0\n        };\n\n        let candidate_responses: Vec\u003c\u0026Response\u003e = endpoint\n            .responses\n            .iter()\n            .filter(|r| self.evaluate_condition(r, context, request_count))\n            .collect();\n\n        let selected_response = if candidate_responses.is_empty() {\n            endpoint\n                .responses\n                .iter()\n                .find(|r| r.default)\n                .context(\"No matching response and no default response found\")?\n        } else if candidate_responses.len() == 1 {\n            candidate_responses[0]\n        } else {\n            self.select_by_probability(\u0026candidate_responses)?\n        };\n\n        let delay = if let Some(delay_config) = \u0026selected_response.delay {\n            let (min, max) = delay_config.parse_range()?;\n            if min == max {\n                min.as_millis() as u64\n            } else {\n                let mut rng = rand::thread_rng();\n                rng.gen_range(min.as_millis()..=max.as_millis()) as u64\n            }\n        } else {\n            0\n        };\n\n        if delay \u003e 0 {\n            info!(delay_ms = delay, \"Adding delay to response\");\n            tokio::time::sleep(Duration::from_millis(delay)).await;\n        }\n\n        let body = selected_response\n            .body\n            .as_ref()\n            .map(|body_template| self.render_template(body_template, context, request_count));\n\n        let mut headers = selected_response.headers.clone();\n        headers.insert(\n            \"X-Request-ID\".to_string(),\n            context\n                .headers\n                .get(\"x-request-id\")\n                .cloned()\n                .unwrap_or_else(|| uuid::Uuid::new_v4().to_string()),\n        );\n\n        if endpoint.stateful {\n            headers.insert(\"X-Request-Count\".to_string(), request_count.to_string());\n        }\n\n        Ok(RuleResponse {\n            status: selected_response.status,\n            body,\n            headers,\n        })\n    }\n\n    fn evaluate_condition(\n        \u0026self,\n        response: \u0026Response,\n        context: \u0026ExecutionContext,\n        request_count: u64,\n    ) -\u003e bool {\n        if let Some(condition) = \u0026response.condition {\n            match self.evaluate_expression(condition, context, request_count) {\n                Ok(result) =\u003e result,\n                Err(e) =\u003e {\n                    tracing::warn!(\n                        condition = %condition,\n                        error = %e,\n                        \"Failed to evaluate condition\"\n                    );\n                    false\n                }\n            }\n        } else {\n            true\n        }\n    }\n\n    fn evaluate_expression(\n        \u0026self,\n        expression: \u0026str,\n        _context: \u0026ExecutionContext,\n        request_count: u64,\n    ) -\u003e anyhow::Result\u003cbool\u003e {\n        // Simple expression evaluation\n        // In a real implementation, this would use a proper expression evaluator\n        let expr = expression.trim().to_lowercase();\n\n        if expr.contains(\"request_count\") {\n            // Parse simple comparisons like \"request_count \u003e 2\"\n            let parts: Vec\u003c\u0026str\u003e = expr.split_whitespace().collect();\n            if parts.len() == 3 \u0026\u0026 parts[0] == \"request_count\" {\n                if let Ok(value) = parts[2].parse::\u003cu64\u003e() {\n                    match parts[1] {\n                        \"\u003e\" =\u003e return Ok(request_count \u003e value),\n                        \"\u003c\" =\u003e return Ok(request_count \u003c value),\n                        \"\u003e=\" =\u003e return Ok(request_count \u003e= value),\n                        \"\u003c=\" =\u003e return Ok(request_count \u003c= value),\n                        \"==\" | \"=\" =\u003e return Ok(request_count == value),\n                        \"!=\" =\u003e return Ok(request_count != value),\n                        _ =\u003e {}\n                    }\n                }\n            }\n        }\n\n        // Default to true for simple expressions\n        Ok(true)\n    }\n\n    fn select_by_probability\u003c'a\u003e(\n        \u0026self,\n        responses: \u0026[\u0026'a Response],\n    ) -\u003e anyhow::Result\u003c\u0026'a Response\u003e {\n        let total_probability: f64 = responses.iter().map(|r| r.probability.unwrap_or(0.0)).sum();\n\n        if total_probability == 0.0 {\n            anyhow::bail!(\"No responses with probability specified\");\n        }\n\n        let mut rng = rand::thread_rng();\n        let random_value: f64 = rng.gen_range(0.0..total_probability);\n\n        let mut cumulative = 0.0;\n        for response in responses {\n            let probability = response.probability.unwrap_or(0.0);\n            cumulative += probability;\n            if random_value \u003c cumulative {\n                return Ok(response);\n            }\n        }\n\n        Ok(responses.last().unwrap())\n    }\n\n    fn render_template(\n        \u0026self,\n        template: \u0026str,\n        context: \u0026ExecutionContext,\n        request_count: u64,\n    ) -\u003e String {\n        let mut result = template.to_string();\n\n        result = result.replace(\"{{request_count}}\", \u0026request_count.to_string());\n        result = result.replace(\"{{method}}\", \u0026context.method);\n        result = result.replace(\"{{path}}\", \u0026context.path);\n        result = result.replace(\"{{client_ip}}\", \u0026context.client_ip);\n        result = result.replace(\"{{timestamp}}\", \u0026chrono::Utc::now().to_rfc3339());\n        result = result.replace(\"{{uuid}}\", \u0026uuid::Uuid::new_v4().to_string());\n        result = result.replace(\"{{request_id}}\", \u0026uuid::Uuid::new_v4().to_string());\n\n        for (key, value) in \u0026context.path_params {\n            result = result.replace(\u0026format!(\"{{{{{}}}}}\", key), value);\n        }\n\n        for param in context.query.split('\u0026') {\n            if let Some((key, value)) = param.split_once('=') {\n                result = result.replace(\u0026format!(\"{{{{query.{}}}}}\", key), value);\n            }\n        }\n\n        result\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::types::{Delay, Endpoint, Response};\n    use std::collections::HashMap;\n\n    fn create_test_context() -\u003e ExecutionContext {\n        ExecutionContext {\n            method: \"GET\".to_string(),\n            path: \"/test\".to_string(),\n            query: \"\".to_string(),\n            headers: HashMap::new(),\n            client_ip: \"127.0.0.1\".to_string(),\n            path_params: HashMap::new(),\n        }\n    }\n\n    fn create_test_endpoint() -\u003e Endpoint {\n        Endpoint {\n            name: \"Test\".to_string(),\n            method: \"GET\".to_string(),\n            path: \"/test\".to_string(),\n            stateful: false,\n            state_key: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            }],\n            schema: None,\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n        }\n    }\n\n    #[tokio::test]\n    async fn test_execute_basic_response() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n        let endpoint = create_test_endpoint();\n        let context = create_test_context();\n\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(result.status, 200);\n        assert_eq!(result.body, Some(\"OK\".to_string()));\n    }\n\n    #[tokio::test]\n    async fn test_execute_with_delay() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.responses[0].delay = Some(Delay::Fixed(\"100ms\".to_string()));\n\n        let context = create_test_context();\n\n        let start = std::time::Instant::now();\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        let elapsed = start.elapsed();\n\n        assert_eq!(result.status, 200);\n        assert!(elapsed \u003e= Duration::from_millis(100));\n    }\n\n    #[tokio::test]\n    async fn test_execute_stateful() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager.clone());\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.stateful = true;\n\n        let context = create_test_context();\n\n        let result1 = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        let result2 = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n\n        assert_eq!(\n            result1.headers.get(\"X-Request-Count\"),\n            Some(\u0026\"1\".to_string())\n        );\n        assert_eq!(\n            result2.headers.get(\"X-Request-Count\"),\n            Some(\u0026\"2\".to_string())\n        );\n        assert_eq!(state_manager.get_count(\"127.0.0.1\"), 2);\n    }\n\n    #[test]\n    fn test_evaluate_condition() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let response = Response {\n            status: 200,\n            delay: None,\n            body: None,\n            headers: HashMap::new(),\n            condition: Some(\"request_count \u003e 2\".to_string()),\n            probability: None,\n            default: false,\n        };\n\n        let context = create_test_context();\n\n        assert!(!executor.evaluate_condition(\u0026response, \u0026context, 1));\n        assert!(executor.evaluate_condition(\u0026response, \u0026context, 3));\n    }\n\n    #[test]\n    fn test_render_template() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut context = create_test_context();\n        context\n            .path_params\n            .insert(\"id\".to_string(), \"123\".to_string());\n        context.query = \"name=John\u0026age=30\".to_string();\n\n        let template = \"User {{id}} ({{query.name}}) from {{client_ip}}\";\n        let result = executor.render_template(template, \u0026context, 1);\n\n        assert!(result.contains(\"123\"));\n        assert!(result.contains(\"John\"));\n        assert!(result.contains(\"127.0.0.1\"));\n    }\n\n    #[test]\n    fn test_render_template_empty_query() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut context = create_test_context();\n        context.query = \"\".to_string();\n\n        let template = \"User {{query.name}}\";\n        let result = executor.render_template(template, \u0026context, 1);\n\n        assert_eq!(result, \"User {{query.name}}\");\n    }\n\n    #[tokio::test]\n    async fn test_execute_stateful_custom_key() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager.clone());\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.stateful = true;\n        endpoint.state_key = Some(\"X-User-ID\".to_string());\n\n        let mut context = create_test_context();\n        context.headers.insert(\"x-user-id\".to_string(), \"user1\".to_string());\n\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(result.headers.get(\"X-Request-Count\"), Some(\u0026\"1\".to_string()));\n        assert_eq!(state_manager.get_count(\"user1\"), 1);\n\n        // Test missing custom key falls back to client_ip\n        context.headers.remove(\"x-user-id\");\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(state_manager.get_count(\"127.0.0.1\"), 1);\n    }\n\n    #[test]\n    fn test_evaluate_expression_operators() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n        let context = create_test_context();\n\n        assert!(executor.evaluate_expression(\"request_count \u003c 5\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count \u003e= 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count \u003c= 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count == 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count = 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count != 4\", \u0026context, 3).unwrap());\n        \n        // Invalid operator or format\n        assert!(executor.evaluate_expression(\"request_count ?? 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"invalid\", \u0026context, 3).unwrap());\n    }\n\n    #[test]\n    fn test_select_by_probability_no_probability() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let responses = vec![\n            Response {\n                status: 200,\n                delay: None,\n                body: None,\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            },\n        ];\n\n        let refs: Vec\u003c\u0026Response\u003e = responses.iter().collect();\n        let result = executor.select_by_probability(\u0026refs);\n        assert!(result.is_err());\n    }\n\n    #[tokio::test]\n    async fn test_execute_range_delay() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.responses[0].delay = Some(Delay::Range(\"10ms-50ms\".to_string()));\n\n        let context = create_test_context();\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(result.status, 200);\n    }\n}\n","traces":[{"line":48,"address":[],"length":0,"stats":{"Line":33}},{"line":52,"address":[],"length":0,"stats":{"Line":15}},{"line":57,"address":[],"length":0,"stats":{"Line":15}},{"line":64,"address":[],"length":0,"stats":{"Line":30}},{"line":65,"address":[],"length":0,"stats":{"Line":12}},{"line":66,"address":[],"length":0,"stats":{"Line":8}},{"line":71,"address":[],"length":0,"stats":{"Line":4}},{"line":72,"address":[],"length":0,"stats":{"Line":8}},{"line":74,"address":[],"length":0,"stats":{"Line":4}},{"line":75,"address":[],"length":0,"stats":{"Line":5}},{"line":76,"address":[],"length":0,"stats":{"Line":2}},{"line":78,"address":[],"length":0,"stats":{"Line":2}},{"line":83,"address":[],"length":0,"stats":{"Line":22}},{"line":86,"address":[],"length":0,"stats":{"Line":23}},{"line":87,"address":[],"length":0,"stats":{"Line":8}},{"line":90,"address":[],"length":0,"stats":{"Line":34}},{"line":91,"address":[],"length":0,"stats":{"Line":8}},{"line":93,"address":[],"length":0,"stats":{"Line":11}},{"line":96,"address":[],"length":0,"stats":{"Line":45}},{"line":97,"address":[],"length":0,"stats":{"Line":15}},{"line":99,"address":[],"length":0,"stats":{"Line":90}},{"line":102,"address":[],"length":0,"stats":{"Line":45}},{"line":103,"address":[],"length":0,"stats":{"Line":0}},{"line":104,"address":[],"length":0,"stats":{"Line":0}},{"line":106,"address":[],"length":0,"stats":{"Line":0}},{"line":108,"address":[],"length":0,"stats":{"Line":15}},{"line":109,"address":[],"length":0,"stats":{"Line":15}},{"line":111,"address":[],"length":0,"stats":{"Line":0}},{"line":114,"address":[],"length":0,"stats":{"Line":32}},{"line":115,"address":[],"length":0,"stats":{"Line":8}},{"line":116,"address":[],"length":0,"stats":{"Line":2}},{"line":117,"address":[],"length":0,"stats":{"Line":1
