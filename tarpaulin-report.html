<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

t(|| \"Failed to parse YAML configuration\")?;\n\n        Self::validate(\u0026config)?;\n\n        Ok(config)\n    }\n\n    fn validate(config: \u0026Config) -\u003e anyhow::Result\u003c()\u003e {\n        if config.server.port == 0 {\n            anyhow::bail!(\"Server port cannot be 0\");\n        }\n\n        if config.server.workers == 0 {\n            anyhow::bail!(\"Number of workers cannot be 0\");\n        }\n\n        if config.telemetry.sampling_rate \u003c 0.0 || config.telemetry.sampling_rate \u003e 1.0 {\n            anyhow::bail!(\"Sampling rate must be between 0.0 and 1.0\");\n        }\n\n        // Validate telemetry endpoint URL\n        if config.telemetry.enabled {\n            Self::validate_telemetry_config(\u0026config.telemetry)?;\n        }\n\n        for endpoint in \u0026config.endpoints {\n            Self::validate_endpoint(endpoint)?;\n        }\n\n        Ok(())\n    }\n\n    fn validate_telemetry_config(\n        config: \u0026crate::config::types::TelemetryConfig,\n    ) -\u003e anyhow::Result\u003c()\u003e {\n        // Validate endpoint URL\n        if config.endpoint.is_empty() {\n            anyhow::bail!(\"Telemetry endpoint cannot be empty\");\n        }\n\n        // Try to parse the URL to validate format\n        if let Ok(url) = reqwest::Url::parse(\u0026config.endpoint) {\n            // Check if URL has a scheme\n            if url.scheme().is_empty() {\n                anyhow::bail!(\"Telemetry endpoint must have a scheme (http:// or https://)\");\n            }\n\n            // Check for valid schemes\n            let scheme = url.scheme();\n            if scheme != \"http\" \u0026\u0026 scheme != \"https\" {\n                anyhow::bail!(\"Telemetry endpoint must use http:// or https:// scheme\");\n            }\n\n            // Check if URL has a host\n            if url.host().is_none() {\n                anyhow::bail!(\"Telemetry endpoint must have a host\");\n            }\n        } else {\n            anyhow: ig: PathBuf,\n\n    #[arg(long, default_value = \"false\")]\n    hot_reload: bool,\n}\n\n#[tokio::main]\nasync fn main() -\u003e anyhow::Result\u003c()\u003e {\n    let args = Args::parse();\n    run(args).await\n}\n\nasync fn run(args: Args) -\u003e anyhow::Result\u003c()\u003e {\n    let config = ConfigLoader::from_file(\u0026args.config)\n        .with_context(|| format!(\"Failed to load config from {:?}\", args.config))?;\n\n    init_telemetry(\u0026config.telemetry).await?;\n\n    let rule_engine = Arc::new(RuleEngine::new(config.endpoints.clone()));\n    let rule_engine_swap = Arc::new(ArcSwap::from(rule_engine.clone()));\n\n    if args.hot_reload {\n        start_hot_reload(\u0026args.config, rule_engine_swap.clone()).await?;\n    }\n\n    let server = run_server(config, rule_engine).await?;\n\n    info!(\"Molock server is running\");\n    info!(\"Press Ctrl+C to shutdown\");\n\n    let server_handle = server.handle();\n    tokio::select! {\n        _ = server =\u003e {\n            info!(\"Server stopped\");\n        }\n        _ = shutdown_signal() =\u003e {\n            info!(\"Shutdown signal received\");\n            server_handle.stop(true).await;\n            info!(\"Server shutdown complete\");\n        }\n    }\n\n    shutdown_telemetry().await;\n\n    Ok(())\n}\n\n#[cfg(feature = \"hot-reload\")]\nasync fn start_hot_reload(\n    config_path: \u0026PathBuf,\n    rule_engine_swap: Arc\u003cArcSwap\u003cRuleEngine\u003e\u003e,\n) -\u003e anyhow::Result\u003c()\u003e {\n    use notify::{RecommendedWatcher, RecursiveMode, Watcher};\n    use std::sync::mpsc;\n    use std::time::Duration;\n\n    let (tx, rx) = mpsc::channel();\n    let mut watcher: RecommendedWatcher = Watcher::new(tx, notify::Config::default())?;\n\n    watcher.watch(config_path, RecursiveMode::NonRecursive)?;\n\n    let config_path = config_path.clone();\n    tokio::spawn(async move {\n        while let Ok(Ok(event)) = rx.recv() {\n            match event {\n                notify::Event {\n                    kind: notify::EventKind::Modify(_),\n                    paths,\n                    ..\n                } =\u003e {\n                    if paths.iter().any(|p| p == \u0026config_path) {\n                        info!(\"Configuration file modified, reloading...\");\n                        match ConfigLoader::from_file(\u0026config_path) {\n                            Ok(new_config) =\u003e {\n                                let new_engine = Arc::new(RuleEngine::new(new_config.endpoints));\n                                rule_engine_swap.store(new_engine);\n                                info!(\"Configuration reloaded successfully\");\n                            }\n                            Err(e) =\u003e {\n                                tracing::error!(\"Failed to reload configuration: {}\", e);\n                            }\n                        }\n                    }\n                }\n                _ =\u003e {}\n            }\n        }\n    });\n\n    Ok(())\n}\n\n#[cfg(not(feature = \"hot-reload\"))]\nasync fn start_hot_reload(\n    _config_path: \u0026PathBuf,\n    _rule_engine_swap: Arc\u003cArcSwap\u003cRuleEngine\u003e\u003e,\n) -\u003e anyhow::Result\u003c()\u003e {\n    info!(\"Hot reload feature is not enabled\");\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs::File;\n    use std::io::Write;\n    use tempfile::tempdir;\n\n    #[tokio::test]\n    async fn test_run_invalid_config() {\n        let dir = tempdir().unwrap();\n        let config_path = dir.path().join(\"invalid.yaml\");\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"invalid yaml\").unwrap();\n\n        let args = Args {\n            config: config_path,\n            hot_reload: false,\n        };\n\n        let result = run(args).await;\n        assert!(result.is_err());\n    }\n\n    #[tokio::test]\n    async fn test_run_success_shutdown() {\n        let dir = tempdir().unwrap();\n        let config_path = dir.path().join(\"config.yaml\");\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"server:\\n  host: 127.0.0.1\\n  port: 0\\n  workers: 1\\n  max_request_size: 1048576\\nendpoints: []\\ntelemetry:\\n  enabled: true\\n  endpoint: http://localhost:4317\\n  protocol: grpc\").unwrap();\n\n        let args = Args {\n            config: config_path,\n            hot_reload: false,\n        };\n\n        // This will at least cover the telemetry init and server creation\n        let _ = run(args).await;\n    }\n\n    #[tokio::test]\n    async fn test_start_hot_reload_change() {\n        let dir = tempdir().unwrap();\n        let config_path = dir.path().join(\"config.yaml\");\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"server:\\n  host: 127.0.0.1\\n  port: 0\\n  workers: 1\\n  max_request_size: 1048576\\nendpoints: []\\ntelemetry:\\n  enabled: false\").unwrap();\n\n        let rule_engine = Arc::new(RuleEngine::new(vec![]));\n        let rule_engine_swap = Arc::new(ArcSwap::from(rule_engine));\n\n        let _ = start_hot_reload(\u0026config_path, rule_engine_swap.clone()).await;\n        \n        // Give watcher some time to start\n        tokio::time::sleep(tokio::time::Duration::from_millis(200)).await;\n\n        // Trigger change\n        let mut file = File::create(\u0026config_path).unwrap();\n        writeln!(file, \"server:\\n  host: 127.0.0.1\\n  port: 0\\n  workers: 1\\n  max_request_size: 1048576\\nendpoints: []\\ntelemetry:\\n  enabled: false\").unwrap();\n        file.flush().unwrap();\n        drop(file);\n\n        // Give some time for event to be processed\n        tokio::time::sleep(tokio::time::Duration::from_millis(1000)).await;\n    }\n}\n","traces":[{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":4}},{"line":62,"address":[],"length":0,"stats":{"Line":4}},{"line":63,"address":[],"length":0,"stats":{"Line":6}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[],"length":0,"stats":{"Line":0}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":86,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":0}},{"line":91,"address":[],"length":0,"stats":{"Line":0}},{"line":93,"address":[],"length":0,"stats":{"Line":0}},{"line":142,"address":[],"length":0,"stats":{"Line":1}},{"line":146,"address":[],"length":0,"stats":{"Line":1}},{"line":147,"address":[],"length":0,"stats":{"Line":1}}],"covered":6,"coverable":27},{"path":["/","Users","fernandoike","projects","pets","molock","src","rules","executor.rs"],"content":"/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\n/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\nuse crate::config::{Endpoint, Response};\nuse crate::rules::state::StateManager;\nuse crate::rules::{ExecutionContext, RuleResponse};\nuse anyhow::Context;\nuse rand::Rng;\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tracing::info;\n\n#[derive(Clone)]\npub struct ResponseExecutor {\n    state_manager: Arc\u003cStateManager\u003e,\n}\n\nimpl ResponseExecutor {\n    pub fn new(state_manager: Arc\u003cStateManager\u003e) -\u003e Self {\n        Self { state_manager }\n    }\n\n    pub async fn execute(\n        \u0026self,\n        endpoint: \u0026Endpoint,\n        context: \u0026ExecutionContext,\n    ) -\u003e anyhow::Result\u003cRuleResponse\u003e {\n        info!(\n            endpoint = %endpoint.name,\n            method = %context.method,\n            path = %context.path,\n            \"Executing endpoint\"\n        );\n\n        let state_key = if endpoint.stateful {\n            let key = endpoint\n                .state_key\n                .as_deref()\n                .unwrap_or(\"client_ip\")\n                .to_string();\n\n            match key.as_str() {\n                \"client_ip\" =\u003e context.client_ip.clone(),\n                _ =\u003e {\n                    let key_lower = key.to_lowercase();\n                    if let Some(value) = context.headers.get(\u0026key_lower) {\n                        value.clone()\n                    } else {\n                        context.client_ip.clone()\n                    }\n                }\n            }\n        } else {\n            \"\".to_string()\n        };\n\n        if endpoint.stateful \u0026\u0026 !state_key.is_empty() {\n            self.state_manager.increment_count(\u0026state_key);\n        }\n\n        let request_count = if endpoint.stateful \u0026\u0026 !state_key.is_empty() {\n            self.state_manager.get_count(\u0026state_key)\n        } else {\n            0\n        };\n\n        let candidate_responses: Vec\u003c\u0026Response\u003e = endpoint\n            .responses\n            .iter()\n            .filter(|r| self.evaluate_condition(r, context, request_count))\n            .collect();\n\n        let selected_response = if candidate_responses.is_empty() {\n            endpoint\n                .responses\n                .iter()\n                .find(|r| r.default)\n                .context(\"No matching response and no default response found\")?\n        } else if candidate_responses.len() == 1 {\n            candidate_responses[0]\n        } else {\n            self.select_by_probability(\u0026candidate_responses)?\n        };\n\n        let delay = if let Some(delay_config) = \u0026selected_response.delay {\n            let (min, max) = delay_config.parse_range()?;\n            if min == max {\n                min.as_millis() as u64\n            } else {\n                let mut rng = rand::thread_rng();\n                rng.gen_range(min.as_millis()..=max.as_millis()) as u64\n            }\n        } else {\n            0\n        };\n\n        if delay \u003e 0 {\n            info!(delay_ms = delay, \"Adding delay to response\");\n            tokio::time::sleep(Duration::from_millis(delay)).await;\n        }\n\n        let body = selected_response\n            .body\n            .as_ref()\n            .map(|body_template| self.render_template(body_template, context, request_count));\n\n        let mut headers = selected_response.headers.clone();\n        headers.insert(\n            \"X-Request-ID\".to_string(),\n            context\n                .headers\n                .get(\"x-request-id\")\n                .cloned()\n                .unwrap_or_else(|| uuid::Uuid::new_v4().to_string()),\n        );\n\n        if endpoint.stateful {\n            headers.insert(\"X-Request-Count\".to_string(), request_count.to_string());\n        }\n\n        Ok(RuleResponse {\n            status: selected_response.status,\n            body,\n            headers,\n        })\n    }\n\n    fn evaluate_condition(\n        \u0026self,\n        response: \u0026Response,\n        context: \u0026ExecutionContext,\n        request_count: u64,\n    ) -\u003e bool {\n        if let Some(condition) = \u0026response.condition {\n            match self.evaluate_expression(condition, context, request_count) {\n                Ok(result) =\u003e result,\n                Err(e) =\u003e {\n                    tracing::warn!(\n                        condition = %condition,\n                        error = %e,\n                        \"Failed to evaluate condition\"\n                    );\n                    false\n                }\n            }\n        } else {\n            true\n        }\n    }\n\n    fn evaluate_expression(\n        \u0026self,\n        expression: \u0026str,\n        _context: \u0026ExecutionContext,\n        request_count: u64,\n    ) -\u003e anyhow::Result\u003cbool\u003e {\n        // Simple expression evaluation\n        // In a real implementation, this would use a proper expression evaluator\n        let expr = expression.trim().to_lowercase();\n\n        if expr.contains(\"request_count\") {\n            // Parse simple comparisons like \"request_count \u003e 2\"\n            let parts: Vec\u003c\u0026str\u003e = expr.split_whitespace().collect();\n            if parts.len() == 3 \u0026\u0026 parts[0] == \"request_count\" {\n                if let Ok(value) = parts[2].parse::\u003cu64\u003e() {\n                    match parts[1] {\n                        \"\u003e\" =\u003e return Ok(request_count \u003e value),\n                        \"\u003c\" =\u003e return Ok(request_count \u003c value),\n                        \"\u003e=\" =\u003e return Ok(request_count \u003e= value),\n                        \"\u003c=\" =\u003e return Ok(request_count \u003c= value),\n                        \"==\" | \"=\" =\u003e return Ok(request_count == value),\n                        \"!=\" =\u003e return Ok(request_count != value),\n                        _ =\u003e {}\n                    }\n                }\n            }\n        }\n\n        // Default to true for simple expressions\n        Ok(true)\n    }\n\n    fn select_by_probability\u003c'a\u003e(\n        \u0026self,\n        responses: \u0026[\u0026'a Response],\n    ) -\u003e anyhow::Result\u003c\u0026'a Response\u003e {\n        let total_probability: f64 = responses.iter().map(|r| r.probability.unwrap_or(0.0)).sum();\n\n        if total_probability == 0.0 {\n            anyhow::bail!(\"No responses with probability specified\");\n        }\n\n        let mut rng = rand::thread_rng();\n        let random_value: f64 = rng.gen_range(0.0..total_probability);\n\n        let mut cumulative = 0.0;\n        for response in responses {\n            let probability = response.probability.unwrap_or(0.0);\n            cumulative += probability;\n            if random_value \u003c cumulative {\n                return Ok(response);\n            }\n        }\n\n        Ok(responses.last().unwrap())\n    }\n\n    fn render_template(\n        \u0026self,\n        template: \u0026str,\n        context: \u0026ExecutionContext,\n        request_count: u64,\n    ) -\u003e String {\n        let mut result = template.to_string();\n\n        result = result.replace(\"{{request_count}}\", \u0026request_count.to_string());\n        result = result.replace(\"{{method}}\", \u0026context.method);\n        result = result.replace(\"{{path}}\", \u0026context.path);\n        result = result.replace(\"{{client_ip}}\", \u0026context.client_ip);\n        result = result.replace(\"{{timestamp}}\", \u0026chrono::Utc::now().to_rfc3339());\n        result = result.replace(\"{{uuid}}\", \u0026uuid::Uuid::new_v4().to_string());\n        result = result.replace(\"{{request_id}}\", \u0026uuid::Uuid::new_v4().to_string());\n\n        for (key, value) in \u0026context.path_params {\n            result = result.replace(\u0026format!(\"{{{{{}}}}}\", key), value);\n        }\n\n        for param in context.query.split('\u0026') {\n            if let Some((key, value)) = param.split_once('=') {\n                result = result.replace(\u0026format!(\"{{{{query.{}}}}}\", key), value);\n            }\n        }\n\n        result\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::types::{Delay, Endpoint, Response};\n    use std::collections::HashMap;\n\n    fn create_test_context() -\u003e ExecutionContext {\n        ExecutionContext {\n            method: \"GET\".to_string(),\n            path: \"/test\".to_string(),\n            query: \"\".to_string(),\n            headers: HashMap::new(),\n            client_ip: \"127.0.0.1\".to_string(),\n            path_params: HashMap::new(),\n        }\n    }\n\n    fn create_test_endpoint() -\u003e Endpoint {\n        Endpoint {\n            name: \"Test\".to_string(),\n            method: \"GET\".to_string(),\n            path: \"/test\".to_string(),\n            stateful: false,\n            state_key: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            }],\n            schema: None,\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n        }\n    }\n\n    #[tokio::test]\n    async fn test_execute_basic_response() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n        let endpoint = create_test_endpoint();\n        let context = create_test_context();\n\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(result.status, 200);\n        assert_eq!(result.body, Some(\"OK\".to_string()));\n    }\n\n    #[tokio::test]\n    async fn test_execute_with_delay() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.responses[0].delay = Some(Delay::Fixed(\"100ms\".to_string()));\n\n        let context = create_test_context();\n\n        let start = std::time::Instant::now();\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        let elapsed = start.elapsed();\n\n        assert_eq!(result.status, 200);\n        assert!(elapsed \u003e= Duration::from_millis(100));\n    }\n\n    #[tokio::test]\n    async fn test_execute_stateful() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager.clone());\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.stateful = true;\n\n        let context = create_test_context();\n\n        let result1 = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        let result2 = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n\n        assert_eq!(\n            result1.headers.get(\"X-Request-Count\"),\n            Some(\u0026\"1\".to_string())\n        );\n        assert_eq!(\n            result2.headers.get(\"X-Request-Count\"),\n            Some(\u0026\"2\".to_string())\n        );\n        assert_eq!(state_manager.get_count(\"127.0.0.1\"), 2);\n    }\n\n    #[test]\n    fn test_evaluate_condition() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let response = Response {\n            status: 200,\n            delay: None,\n            body: None,\n            headers: HashMap::new(),\n            condition: Some(\"request_count \u003e 2\".to_string()),\n            probability: None,\n            default: false,\n        };\n\n        let context = create_test_context();\n\n        assert!(!executor.evaluate_condition(\u0026response, \u0026context, 1));\n        assert!(executor.evaluate_condition(\u0026response, \u0026context, 3));\n    }\n\n    #[test]\n    fn test_render_template() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut context = create_test_context();\n        context\n            .path_params\n            .insert(\"id\".to_string(), \"123\".to_string());\n        context.query = \"name=John\u0026age=30\".to_string();\n\n        let template = \"User {{id}} ({{query.name}}) from {{client_ip}}\";\n        let result = executor.render_template(template, \u0026context, 1);\n\n        assert!(result.contains(\"123\"));\n        assert!(result.contains(\"John\"));\n        assert!(result.contains(\"127.0.0.1\"));\n    }\n\n    #[test]\n    fn test_render_template_empty_query() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut context = create_test_context();\n        context.query = \"\".to_string();\n\n        let template = \"User {{query.name}}\";\n        let result = executor.render_template(template, \u0026context, 1);\n\n        assert_eq!(result, \"User {{query.name}}\");\n    }\n\n    #[tokio::test]\n    async fn test_execute_stateful_custom_key() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager.clone());\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.stateful = true;\n        endpoint.state_key = Some(\"X-User-ID\".to_string());\n\n        let mut context = create_test_context();\n        context.headers.insert(\"x-user-id\".to_string(), \"user1\".to_string());\n\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(result.headers.get(\"X-Request-Count\"), Some(\u0026\"1\".to_string()));\n        assert_eq!(state_manager.get_count(\"user1\"), 1);\n\n        // Test missing custom key falls back to client_ip\n        context.headers.remove(\"x-user-id\");\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(state_manager.get_count(\"127.0.0.1\"), 1);\n    }\n\n    #[test]\n    fn test_evaluate_expression_operators() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n        let context = create_test_context();\n\n        assert!(executor.evaluate_expression(\"request_count \u003c 5\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count \u003e= 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count \u003c= 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count == 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count = 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"request_count != 4\", \u0026context, 3).unwrap());\n        \n        // Invalid operator or format\n        assert!(executor.evaluate_expression(\"request_count ?? 3\", \u0026context, 3).unwrap());\n        assert!(executor.evaluate_expression(\"invalid\", \u0026context, 3).unwrap());\n    }\n\n    #[test]\n    fn test_select_by_probability_no_probability() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let responses = vec![\n            Response {\n                status: 200,\n                delay: None,\n                body: None,\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            },\n        ];\n\n        let refs: Vec\u003c\u0026Response\u003e = responses.iter().collect();\n        let result = executor.select_by_probability(\u0026refs);\n        assert!(result.is_err());\n    }\n\n    #[tokio::test]\n    async fn test_execute_range_delay() {\n        let state_manager = Arc::new(StateManager::new());\n        let executor = ResponseExecutor::new(state_manager);\n\n        let mut endpoint = create_test_endpoint();\n        endpoint.responses[0].delay = Some(Delay::Range(\"10ms-50ms\".to_string()));\n\n        let context = create_test_context();\n        let result = executor.execute(\u0026endpoint, \u0026context).await.unwrap();\n        assert_eq!(result.status, 200);\n    }\n}\n","traces":[{"line":48,"address":[],"length":0,"stats":{"Line":33}},{"line":52,"address":[],"length":0,"stats":{"Line":15}},{"line":57,"address":[],"length":0,"stats":{"Line":15}},{"line":64,"address":[],"length":0,"stats":{"Line":30}},{"line":65,"address":[],"length":0,"stats":{"Line":12}},{"line":66,"address":[],"length":0,"stats":{"Line":8}},{"line":71,"address":[],"length":0,"stats":{"Line":4}},{"line":72,"address":[],"length":0,"stats":{"Line":8}},{"line":74,"address":[],"length":0,"stats":{"Line":4}},{"line":75,"address":[],"length":0,"stats":{"Line":5}},{"line":76,"address":[],"length":0,"stats":{"Line":2}},{"line":78,"address":[],"length":0,"stats":{"Line":2}},{"line":83,"address":[],"length":0,"stats":{"Line":22}},{"line":86,"address":[] Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\nuse crate::config::Endpoint;\nuse regex::Regex;\nuse std::collections::HashMap;\n\n#[derive(Clone)]\npub struct RuleMatcher {\n    endpoints: Vec\u003cEndpoint\u003e,\n    path_patterns: HashMap\u003cString, Regex\u003e,\n    custom_path_regexes: HashMap\u003cString, Regex\u003e,\n    headers_regexes: HashMap\u003cString, HashMap\u003cString, Regex\u003e\u003e,\n    query_regexes: HashMap\u003cString, HashMap\u003cString, Regex\u003e\u003e,\n}\n\nimpl RuleMatcher {\n    pub fn new(mut endpoints: Vec\u003cEndpoint\u003e) -\u003e Self {\n        let mut path_patterns = HashMap::new();\n        let mut custom_path_regexes = HashMap::new();\n        let mut headers_regexes = HashMap::new();\n        let mut query_regexes = HashMap::new();\n\n        // Sort endpoints by specificity:\n        // 1. Static paths (no : or *)\n        // 2. Paths with parameters (:)\n        // 3. Paths with wildcards (*)\n        // Among those, longer paths come first.\n        endpoints.sort_by(|a, b| {\n            let a_score = Self::path_specificity_score(\u0026a.path);\n            let b_score = Self::path_specificity_score(\u0026b.path);\n\n            if a_score != b_score {\n                b_score.cmp(\u0026a_score) // Higher score first\n            } else {\n                b.path.len().cmp(\u0026a.path.len()) // Longer path first\n            }\n        });\n\n        for endpoint in \u0026endpoints {\n            let normalized_path = Self::normalize_path(\u0026endpoint.path);\n            let pattern = Self::compile_path_pattern(\u0026normalized_path);\n            path_patterns.insert(endpoint.path.clone(), pattern);\n\n            if let Some(ref path_regex_str) = endpoint.path_regex {\n                if let Ok(re) = Regex::new(path_regex_str) {\n                    custom_path_regexes.insert(endpoint.name.clone(), re);\n                }\n            }\n\n            if let Some(ref headers_regex_map) = endpoint.headers_regex {\n                let mut re_map = HashMap::new();\n                for (header, re_str) in headers_regex_map {\n                    if let Ok(re) = Regex::new(re_str) {\n                        re_map.insert(header.clone(), re);\n                    }\n                }\n                headers_regexes.insert(endpoint.name.clone(), re_map);\n            }\n\n            if let Some(ref query_regex_map) = endpoint.query_regex {\n                let mut re_map = HashMap::new();\n                for (param, re_str) in query_regex_map {\n                    if let Ok(re) = Regex::new(re_str) {\n                        re_map.insert(param.clone(), re);\n                    }\n                }\n                query_regexes.insert(endpoint.name.clone(), re_map);\n            }\n        }\n\n        Self {\n            endpoints,\n            path_patterns,\n            custom_path_regexes,\n            headers_regexes,\n            query_regexes,\n        }\n    }\n\n    fn path_specificity_score(path: \u0026str) -\u003e u32 {\n        if path.contains('*') {\n            1\n        } else if path.contains(':') {\n            2\n        } else {\n            3\n        }\n    }\n\n    fn normalize_path(path: \u0026str) -\u003e String {\n        let mut normalized = String::new();\n        let mut last_was_slash = false;\n\n        for c in path.chars() {\n            if c == '/' {\n                if !last_was_slash {\n                    normalized.push(c);\n                    last_was_slash = true;\n                }\n            } else {\n                normalized.push(c);\n                last_was_slash = false;\n            }\n        }\n\n        // Remove trailing slash if not the only character\n        if normalized.len() \u003e 1 \u0026\u0026 normalized.ends_with('/') {\n            normalized.pop();\n        }\n\n        if normalized.is_empty() {\n            \"/\".to_string()\n        } else {\n            normalized\n        }\n    }\n    pub fn find_match(\u0026self, method: \u0026str, path: \u0026str) -\u003e anyhow::Result\u003c\u0026Endpoint\u003e {\n        self.find_match_with_context(method, path, \u0026HashMap::new(), \"\")\n    }\n\n    pub fn find_match_with_context(\n        \u0026self,\n        method: \u0026str,\n        path: \u0026str,\n        headers: \u0026HashMap\u003cString, String\u003e,\n        query: \u0026str,\n    ) -\u003e anyhow::Result\u003c\u0026Endpoint\u003e {\n        let normalized_request_path = Self::normalize_path(path);\n\n        for endpoint in \u0026self.endpoints {\n            if endpoint.method.to_uppercase() != method.to_uppercase() {\n                continue;\n            }\n\n            // 1. Match Path (Exact/Param/Wildcard OR Custom Regex)\n            let path_matches = if let Some(re) = self.custom_path_regexes.get(\u0026endpoint.name) {\n                re.is_match(\u0026normalized_request_path)\n            } else {\n                self.matches_path(\u0026endpoint.path, \u0026normalized_request_path)\n            };\n\n            if !path_matches {\n                continue;\n            }\n\n            // 2. Match Headers Regex\n            if !self.matches_headers(\u0026endpoint.name, headers) {\n                continue;\n            }\n\n            // 3. Match Query Regex\n            if !self.matches_query(\u0026endpoint.name, query) {\n                continue;\n            }\n\n            return Ok(endpoint);\n        }\n\n        anyhow::bail!(\"No matching endpoint found for {} {}\", method, path)\n    }\n\n    fn matches_headers(\u0026self, endpoint_name: \u0026str, headers: \u0026HashMap\u003cString, String\u003e) -\u003e bool {\n        if let Some(re_map) = self.headers_regexes.get(endpoint_name) {\n            for (header_name, re) in re_map {\n                // Headers in actix-web are usually lowercase in keys when converted to HashMap\n                // but let's be safe and check case-insensitively for the key.\n                let value = headers\n                    .get(header_name)\n                    .or_else(|| headers.get(\u0026header_name.to_lowercase()));\n\n                match value {\n                    Some(v) =\u003e {\n                        if !re.is_match(v) {\n                            return false;\n                        }\n                    }\n                    None =\u003e return false, // Required header missing\n                }\n            }\n        }\n        true\n    }\n\n    fn matches_query(\u0026self, endpoint_name: \u0026str, query: \u0026str) -\u003e bool {\n        if let Some(re_map) = self.query_regexes.get(endpoint_name) {\n            // Parse query string into a map\n            let query_map: HashMap\u003cString, String\u003e = query\n                .split('\u0026')\n                .filter_map(|s| s.split_once('='))\n                .map(|(k, v)| (k.to_string(), v.to_string()))\n                .collect();\n\n            for (param_name, re) in re_map {\n                match query_map.get(param_name) {\n                    Some(v) =\u003e {\n                        if !re.is_match(v) {\n                            return false;\n                        }\n                    }\n                    None =\u003e return false, // Required query param missing\n                }\n            }\n        }\n        true\n    }\n\n    pub fn extract_path_params(\n        \u0026self,\n        endpoint_path: \u0026str,\n        request_path: \u0026str,\n    ) -\u003e HashMap\u003cString, String\u003e {\n        let mut params = HashMap::new();\n        let normalized_request_path = Self::normalize_path(request_path);\n\n        if let Some(pattern) = self.path_patterns.get(endpoint_path) {\n            if let Some(captures) = pattern.captures(\u0026normalized_request_path) {\n                let param_names = Self::extract_param_names(endpoint_path);\n\n                for (i, name) in param_names.iter().enumerate() {\n                    if let Some(value) = captures.get(i + 1) {\n                        params.insert(name.clone(), value.as_str().to_string());\n                    }\n                }\n            }\n        }\n\n        params\n    }\n\n    fn matches_path(\u0026self, endpoint_path: \u0026str, request_path: \u0026str) -\u003e bool {\n        if let Some(pattern) = self.path_patterns.get(endpoint_path) {\n            pattern.is_match(request_path)\n        } else {\n            let normalized_endpoint = Self::normalize_path(endpoint_path);\n            normalized_endpoint == request_path\n        }\n    }\n\n    fn compile_path_pattern(path: \u0026str) -\u003e Regex {\n        let mut pattern = String::new();\n        let mut in_param = false;\n        let _param_name = String::new();\n\n        for c in path.chars() {\n            match c {\n                ':' =\u003e {\n                    in_param = true;\n                    pattern.push_str(\"([^/]+)\");\n                }\n                '/' =\u003e {\n                    if in_param {\n                        in_param = false;\n                    }\n                    pattern.push_str(\"\\\\/\");\n                }\n                '*' =\u003e {\n                    pattern.push_str(\".*\");\n                }\n                _ =\u003e {\n                    if !in_param {\n                        pattern.push(c);\n                    }\n                }\n            }\n        }\n\n        Regex::new(\u0026format!(\"^{}$\", pattern)).unwrap_or_else(|_| Regex::new(\"^$\").unwrap())\n    }\n\n    fn extract_param_names(path: \u0026str) -\u003e Vec\u003cString\u003e {\n        let mut params = Vec::new();\n        let mut in_param = false;\n        let mut param_name = String::new();\n\n        for c in path.chars() {\n            match c {\n                ':' =\u003e {\n                    in_param = true;\n                    param_name.clear();\n                }\n                '/' =\u003e {\n                    if in_param \u0026\u0026 !param_name.is_empty() {\n                        params.push(param_name.clone());\n                    }\n                    in_param = false;\n                    param_name.clear();\n                }\n                _ =\u003e {\n                    if in_param {\n                        param_name.push(c);\n                    }\n                }\n            }\n        }\n\n        if in_param \u0026\u0026 !param_name.is_empty() {\n            params.push(param_name);\n        }\n\n        params\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::types::Response;\n    use std::collections::HashMap;\n\n    fn create_test_endpoint(method: \u0026str, path: \u0026str) -\u003e Endpoint {\n        Endpoint {\n            name: \"Test\".to_string(),\n            method: method.to_string(),\n            path: path.to_string(),\n            stateful: false,\n            state_key: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            }],\n            schema: None,\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n        }\n    }\n\n    #[test]\n    fn test_find_match_exact_path() {\n        let endpoints = vec![\n            create_test_endpoint(\"GET\", \"/api/users\"),\n            create_test_endpoint(\"POST\", \"/api/users\"),\n        ];\n\n        let matcher = RuleMatcher::new(endpoints);\n\n        let endpoint = matcher.find_match(\"GET\", \"/api/users\").unwrap();\n        assert_eq!(endpoint.method, \"GET\");\n        assert_eq!(endpoint.path, \"/api/users\");\n\n        let endpoint = matcher.find_match(\"POST\", \"/api/users\").unwrap();\n        assert_eq!(endpoint.method, \"POST\");\n        assert_eq!(endpoint.path, \"/api/users\");\n    }\n\n    #[test]\n    fn test_find_match_with_params() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/users/:id\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        let endpoint = matcher.find_match(\"GET\", \"/users/123\").unwrap();\n        assert_eq!(endpoint.path, \"/users/:id\");\n    }\n\n    #[test]\n    fn test_find_match_no_match() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/api/users\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        let result = matcher.find_match(\"GET\", \"/api/products\");\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_extract_path_params() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/users/:id/posts/:post_id\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        // First find the endpoint\n        let endpoint = matcher.find_match(\"GET\", \"/users/123/posts/456\").unwrap();\n        let params = matcher.extract_path_params(\u0026endpoint.path, \"/users/123/posts/456\");\n        assert_eq!(params.get(\"id\"), Some(\u0026\"123\".to_string()));\n        assert_eq!(params.get(\"post_id\"), Some(\u0026\"456\".to_string()));\n    }\n\n    #[test]\n    fn test_extract_param_names() {\n        let params = RuleMatcher::extract_param_names(\"/users/:id/posts/:post_id/comments\");\n        assert_eq!(params, vec![\"id\".to_string(), \"post_id\".to_string()]);\n\n        let params = RuleMatcher::extract_param_names(\"/static/path\");\n        assert!(params.is_empty());\n\n        let params = RuleMatcher::extract_param_names(\"/:single\");\n        assert_eq!(params, vec![\"single\".to_string()]);\n    }\n\n    #[test]\n    fn test_matches_path_with_wildcard() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/api/*\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        let endpoint = matcher.find_match(\"GET\", \"/api/users\").unwrap();\n        assert_eq!(endpoint.path, \"/api/*\");\n\n        let endpoint = matcher.find_match(\"GET\", \"/api/users/123\").unwrap();\n        assert_eq!(endpoint.path, \"/api/*\");\n    }\n\n    #[test]\n    fn test_case_insensitive_method() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/test\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        let endpoint = matcher.find_match(\"get\", \"/test\").unwrap();\n        assert_eq!(endpoint.method, \"GET\");\n    }\n\n    #[test]\n    fn test_find_match_trailing_slash() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/api/users\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        // Should match even with trailing slash in the request\n        let endpoint = matcher.find_match(\"GET\", \"/api/users/\").unwrap();\n        assert_eq!(endpoint.path, \"/api/users\");\n    }\n\n    #[test]\n    fn test_find_match_duplicate_slashes() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/api/users\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        // Should match even with duplicate slashes in the request\n        let endpoint = matcher.find_match(\"GET\", \"//api///users\").unwrap();\n        assert_eq!(endpoint.path, \"/api/users\");\n    }\n\n    #[test]\n    fn test_find_match_precedence() {\n        let endpoints = vec![\n            create_test_endpoint(\"GET\", \"/api/*\"),\n            create_test_endpoint(\"GET\", \"/api/users\"),\n            create_test_endpoint(\"GET\", \"/api/:id\"),\n        ];\n        let matcher = RuleMatcher::new(endpoints);\n\n        // Exact match should win over param or wildcard\n        let endpoint = matcher.find_match(\"GET\", \"/api/users\").unwrap();\n        assert_eq!(endpoint.path, \"/api/users\");\n\n        // Param match should win over wildcard\n        let endpoint = matcher.find_match(\"GET\", \"/api/123\").unwrap();\n        assert_eq!(endpoint.path, \"/api/:id\");\n    }\n\n    #[test]\n    fn test_extract_path_params_duplicate_names() {\n        let endpoints = vec![create_test_endpoint(\"GET\", \"/users/:id/posts/:id\")];\n        let matcher = RuleMatcher::new(endpoints);\n\n        let params = matcher.extract_path_params(\"/users/:id/posts/:id\", \"/users/123/posts/456\");\n\n        // It should return the last value for the duplicate parameter name\n        assert_eq!(params.get(\"id\").unwrap(), \"456\");\n    }\n\n    #[test]\n    fn test_find_match_with_path_regex() {\n        let mut endpoint = create_test_endpoint(\"GET\", \"/users/:id\");\n        endpoint.path_regex = Some(r\"^/users/[0-9]+$\".to_string());\n        let matcher = RuleMatcher::new(vec![endpoint]);\n\n        // Should match numeric ID\n        assert!(matcher\n            .find_match_with_context(\"GET\", \"/users/123\", \u0026HashMap::new(), \"\")\n            .is_ok());\n\n        // Should NOT match alphabetic ID\n        assert!(matcher\n            .find_match_with_context(\"GET\", \"/users/abc\", \u0026HashMap::new(), \"\")\n            .is_err());\n    }\n\n    #[test]\n    fn test_find_match_with_headers_regex() {\n        let mut endpoint = create_test_endpoint(\"GET\", \"/api\");\n        let mut headers_regex = HashMap::new();\n        headers_regex.insert(\"X-Auth\".to_string(), r\"^token-[0-9]+$\".to_string());\n        endpoint.headers_regex = Some(headers_regex);\n\n        let matcher = RuleMatcher::new(vec![endpoint]);\n\n        let mut valid_headers = HashMap::new();\n        valid_headers.insert(\"X-Auth\".to_string(), \"token-123\".to_string());\n        assert!(matcher\n            .find_match_with_context(\"GET\", \"/api\", \u0026valid_headers, \"\")\n            .is_ok());\n\n        let mut invalid_headers = HashMap::new();\n        invalid_headers.insert(\"X-Auth\".to_string(), \"token-abc\".to_string());\n        assert!(matcher\n            .find_match_with_context(\"GET\", \"/api\", \u0026invalid_headers, \"\")\n            .is_err());\n    }\n\n    #[test]\n    fn test_find_match_with_query_regex() {\n        let mut endpoint = create_test_endpoint(\"GET\", \"/api\");\n        let mut query_regex = HashMap::new();\n        query_regex.insert(\"page\".to_string(), r\"^[0-9]+$\".to_string());\n        endpoint.query_regex = Some(query_regex);\n\n        let matcher = RuleMatcher::new(vec![endpoint]);\n\n        assert!(matcher\n            .find_match_with_context(\"GET\", \"/api\", \u0026HashMap::new(), \"page=1\")\n            .is_ok());\n        assert!(matcher\n            .find_match_with_context(\"GET\", \"/api\", \u0026HashMap::new(), \"page=abc\")\n            .is_err());\n    }\n}\n","traces":[{"line":47,"address":[],"length":0,"stats":{"Line":36}},{"line":48,"address":[],"length":0,"stats":{"Line":72}},{"line":49,"address":[],"length":0,"stats":{"Line":72}},{"line":50,"address":[],"length":0,"stats":{"Line":72}},{"line":51,"address":[],"length":0,"stats":{"Line":72}},{"line":58,"address":[],"length":0,"stats":{"Line":78}},{"line":59,"address":[],"length":0,"stats":{"Line":18}},{"line":60,"address":[],"length":0,"stats":{"Line":18}},{"line":62,"address":[],"length":0,"stats":{"Line":6}},{"line":63,"address":[],"length":0,"stats":{"Line":15}},{"line":65,"address":[],"length":0,"stats":{"Line":3}},{"line":69,"address":[],"length":0,"stats":{"Line":67}},{"line":70,"address":[],"length":0,"stats":{"Line":93}},{"line":71,"address":[],"length":0," language governing permissions and\n * limitations under the License.\n */\n\n/*\n * Copyright 2026 Molock Team\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in compliance with the License.\n * You may obtain a copy of the License at\n *\n *     http://www.apache.org/licenses/LICENSE-2.0\n *\n * Unless required by applicable law or agreed to in writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\npub mod executor;\npub mod matcher;\npub mod state;\n\nuse crate::config::Endpoint;\nuse executor::ResponseExecutor;\nuse jsonschema::Validator;\nuse matcher::RuleMatcher;\nuse state::StateManager;\nuse std::collections::HashMap;\nuse std::sync::Arc;\n\n#[derive(Clone)]\npub struct RuleEngine {\n    matcher: RuleMatcher,\n    executor: ResponseExecutor,\n    pub compiled_schemas: HashMap\u003cString, Arc\u003cValidator\u003e\u003e,\n}\n\nimpl RuleEngine {\n    pub fn new(endpoints: Vec\u003cEndpoint\u003e) -\u003e Self {\n        let state_manager = Arc::new(StateManager::new());\n        let matcher = RuleMatcher::new(endpoints.clone());\n        let executor = ResponseExecutor::new(state_manager.clone());\n        let mut compiled_schemas = HashMap::new();\n\n        for endpoint in \u0026endpoints {\n            if let Some(schema_val) = \u0026endpoint.schema {\n                let validator = jsonschema::validator_for(schema_val).unwrap_or_else(|e| {\n                    panic!(\"Failed to compile schema for {}: {}\", endpoint.name, e);\n                });\n                compiled_schemas.insert(endpoint.name.clone(), Arc::new(validator));\n            } else if let Some(schema_path) = \u0026endpoint.schema_file {\n                // In a real implementation, we would load from file.\n                // For now, let's just handle it as a placeholder.\n                let content = std::fs::read_to_string(schema_path).unwrap_or_else(|e| {\n                    panic!(\n                        \"Failed to read schema file {} for {}: {}\",\n                        schema_path, endpoint.name, e\n                    );\n                });\n                let schema_val: serde_json::Value =\n                    serde_json::from_str(\u0026content).unwrap_or_else(|e| {\n                        panic!(\n                            \"Failed to parse JSON from schema file {} for {}: {}\",\n                            schema_path, endpoint.name, e\n                        );\n                    });\n                let validator = jsonschema::validator_for(\u0026schema_val).unwrap_or_else(|e| {\n                    panic!(\"Failed to compile schema for {}: {}\", endpoint.name, e);\n                });\n                compiled_schemas.insert(endpoint.name.clone(), Arc::new(validator));\n            }\n        }\n\n        Self {\n            matcher,\n            executor,\n            compiled_schemas,\n        }\n    }\n\n    pub async fn execute(\n        \u0026self,\n        method: \u0026str,\n        path: \u0026str,\n        query: \u0026str,\n        headers: \u0026HashMap\u003cString, String\u003e,\n        body: Option\u003c\u0026str\u003e,\n        client_ip: \u0026str,\n    ) -\u003e anyhow::Result\u003cRuleResponse\u003e {\n        let endpoint = self\n            .matcher\n            .find_match_with_context(method, path, headers, query)?;\n\n        // Schema validation\n        if let Some(validator) = self.compiled_schemas.get(\u0026endpoint.name) {\n            let body_val: serde_json::Value = if let Some(body_str) = body {\n                match serde_json::from_str(body_str) {\n                    Ok(val) =\u003e val,\n                    Err(e) =\u003e {\n                        return Ok(RuleResponse {\n                            status: 400,\n                            body: Some(\n                                serde_json::json!({\n                                    \"error\": \"Invalid JSON payload\",\n                                    \"details\": e.to_string()\n                                })\n                                .to_string(),\n                            ),\n                            headers: HashMap::new(),\n                        });\n                    }\n                }\n            } else {\n                serde_json::Value::Null\n            };\n\n            if !validator.is_valid(\u0026body_val) {\n                let errors: Vec\u003cString\u003e = validator\n                    .iter_errors(\u0026body_val)\n                    .map(|err| err.to_string())\n                    .collect();\n\n                return Ok(RuleResponse {\n                    status: 400,\n                    body: Some(\n                        serde_json::json!({\n                            \"error\": \"Validation error\",\n                            \"details\": errors\n                        })\n                        .to_string(),\n                    ),\n                    headers: HashMap::new(),\n                });\n            }\n        }\n\n        let context = ExecutionContext {\n            method: method.to_string(),\n            path: path.to_string(),\n            query: query.to_string(),\n            headers: headers.clone(),\n            client_ip: client_ip.to_string(),\n            path_params: self.matcher.extract_path_params(\u0026endpoint.path, path),\n        };\n\n        self.executor.execute(endpoint, \u0026context).await\n    }\n}\n\npub struct ExecutionContext {\n    pub method: String,\n    pub path: String,\n    pub query: String,\n    pub headers: HashMap\u003cString, String\u003e,\n    pub client_ip: String,\n    pub path_params: HashMap\u003cString, String\u003e,\n}\n\n#[derive(Debug, Clone)]\npub struct RuleResponse {\n    pub status: u16,\n    pub body: Option\u003cString\u003e,\n    pub headers: HashMap\u003cString, String\u003e,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::types::Response;\n    use std::collections::HashMap;\n\n    #[test]\n    fn test_rule_engine_creation() {\n        let endpoints = vec![Endpoint {\n            name: \"Test\".to_string(),\n            method: \"GET\".to_string(),\n            path: \"/test\".to_string(),\n            stateful: false,\n            state_key: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            }],\n            schema: None,\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n        }];\n\n        let _engine = RuleEngine::new(endpoints);\n    }\n\n    #[tokio::test]\n    async fn test_execute_no_endpoints() {\n        let engine = RuleEngine::new(vec![]);\n        let result = engine\n            .execute(\"GET\", \"/test\", \"\", \u0026HashMap::new(), None, \"127.0.0.1\")\n            .await;\n\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_rule_engine_compiles_valid_schema() {\n        let endpoints = vec![Endpoint {\n            name: \"Schema Test\".to_string(),\n            method: \"POST\".to_string(),\n            path: \"/api\".to_string(),\n            stateful: false,\n            state_key: None,\n            schema: Some(serde_json::json!({\n                \"type\": \"object\",\n                \"properties\": {\n                    \"age\": { \"type\": \"integer\" }\n                }\n            })),\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n            \u0026HashMap::new(),\n                Some(r#\"{\"id\": 123}\"#),\n                \"127.0.0.1\",\n            )\n            .await\n            .unwrap();\n\n        assert_eq!(result.status, 200);\n        assert_eq!(result.body, Some(\"OK\".to_string()));\n    }\n\n    #[tokio::test]\n    async fn test_execute_schema_validation_failure() {\n        let endpoints = vec![Endpoint {\n            name: \"Schema Test\".to_string(),\n            method: \"POST\".to_string(),\n            path: \"/api\".to_string(),\n            stateful: false,\n            state_key: None,\n            schema: Some(serde_json::json!({\n                \"type\": \"object\",\n                \"properties\": {\n                    \"id\": { \"type\": \"integer\" }\n                },\n                \"required\": [\"id\"]\n            })),\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: true,\n            }],\n        }];\n\n        let engine = RuleEngine::new(endpoints);\n        let result = engine\n            .execute(\n                \"POST\",\n                \"/api\",\n                \"\",\n                \u0026HashMap::new(),\n                Some(r#\"{\"id\": \"not an integer\"}\"#),\n                \"127.0.0.1\",\n            )\n            .await\n            .unwrap();\n\n        assert_eq!(result.status, 400);\n        assert!(result.body.unwrap().contains(\"Validation error\"));\n    }\n\n    #[tokio::test]\n    async fn test_execute_schema_validation_invalid_json() {\n        let endpoints = vec![Endpoint {\n            name: \"Schema Test\".to_string(),\n            method: \"POST\".to_string(),\n            path: \"/api\".to_string(),\n            stateful: false,\n            state_key: None,\n            schema: Some(serde_json::json!({ \"type\": \"object\" })),\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: true,\n            }],\n        }];\n\n        let engine = RuleEngine::new(endpoints);\n        let result = engine\n            .execute(\n                \"POST\",\n                \"/api\",\n                \"\",\n                \u0026HashMap::new(),\n                Some(r#\"{\"invalid\": json\"#),\n                \"127.0.0.1\",\n            )\n            .await\n            .unwrap();\n\n        assert_eq!(result.status, 400);\n        assert!(result.body.unwrap().contains(\"Invalid JSON payload\"));\n    }\n\n    #[tokio::test]\n    async fn test_execute_with_regex_matching() {\n        let endpoint = Endpoint {\n            name: \"Regex Test\".to_string(),\n            method: \"GET\".to_string(),\n            path: \"/api\".to_string(),\n            stateful: false,\n            state_key: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: true,\n            }],\n            schema: None,\n            schema_file: None,\n            path_regex: None,\n            headers_regex: Some({\n                let mut h = HashMap::new();\n                h.insert(\"X-Required\".to_string(), \"^secret$\".to_string());\n                h\n            }),\n            query_regex: Some({\n                let mut q = HashMap::new();\n                q.insert(\"v\".to_string(), \"^1$\".to_string());\n                q\n            }),\n        };\n\n        let engine = RuleEngine::new(vec![endpoint]);\n\n        // Should match with correct headers and query\n        let mut headers = HashMap::new();\n        headers.insert(\"X-Required\".to_string(), \"secret\".to_string());\n        let result = engine\n            .execute(\"GET\", \"/api\", \"v=1\", \u0026headers, None, \"127.0.0.1\")\n            .await;\n        assert!(result.is_ok());\n\n        // Should NOT match if header is wrong\n        let mut bad_headers = HashMap::new();\n        bad_headers.insert(\"X-Required\".to_string(), \"wrong\".to_string());\n        let result = engine\n            .execute(\"GET\", \"/api\", \"v=1\", \u0026bad_headers, None, \"127.0.0.1\")\n            .await;\n        assert!(result.is_err());\n    }\n}\n","traces":[{"line":53,"address":[],"length":0,"stats":{"Line":23}},{"line":54,"address":[],"length":0,"stats":{"Line":69}},{"line":55,"address":[],"length":0,"stats":{"Line":92}},{"line":56,"address":[],"length":0,"stats":{"Line":92}},{"line":57,"address":[],"length":0,"stats":{"Line":46}},{"line":59,"address":[],"length":0,"stats":{"Line":37}},{"line":60,"address":[],"length":0,"stats":{"Line":18}},{"line":61,"address":[],"length":0,"stats":{"Line":17}},{"line":62,"address":[],"length":0,"stats":{"Line":1}},{"line":64,"address":[],"length":0,"stats":{"Line":24}},{"line":65,"address":[],"length":0,"stats":{"Line":11}},{"line":68,"address":[],"length":0,"stats":{"Line":4}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[],"length":0,"stats":{"Line":2}},{"line":75,"address":[],"length":0,"stats":{"Line":3}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":4}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"addre ers: Arc::new(DashMap::new()),\n            ttl,\n        }\n    }\n\n    pub fn increment_count(\u0026self, key: \u0026str) -\u003e u64 {\n        self.cleanup_expired();\n\n        let mut entry = self\n            .counters\n            .entry(key.to_string())\n            .or_insert_with(|| CounterState {\n                count: 0,\n                last_updated: Instant::now(),\n            });\n\n        entry.count += 1;\n        entry.last_updated = Instant::now();\n        entry.count\n    }\n\n    pub fn get_count(\u0026self, key: \u0026str) -\u003e u64 {\n        self.cleanup_expired();\n\n        self.counters.get(key).map(|entry| entry.count).unwrap_or(0)\n    }\n\n    pub fn cleanup_expired(\u0026self) {\n        let now = Instant::now();\n        let expired_keys: Vec\u003cString\u003e = self\n            .counters\n            .iter()\n            .filter(|entry| now.duration_since(entry.last_updated) \u003e self.ttl)\n            .map(|entry| entry.key().clone())\n            .collect();\n\n        for key in expired_keys {\n            self.counters.remove(\u0026key);\n        }\n    }\n}\n\nimpl Default for StateManager {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::thread;\n\n    #[test]\n    fn test_increment_and_get_count() {\n        let manager = StateManager::new();\n\n        assert_eq!(manager.get_count(\"test\"), 0);\n\n        assert_eq!(manager.increment_count(\"test\"), 1);\n        assert_eq!(manager.get_count(\"test\"), 1);\n\n        assert_eq!(manager.increment_count(\"test\"), 2);\n        assert_eq!(manager.get_count(\"test\"), 2);\n    }\n\n    #[test]\n    fn test_multiple_keys() {\n        let manager = StateManager::new();\n\n        assert_eq!(manager.increment_count(\"key1\"), 1);\n        assert_eq!(manager.increment_count(\"key2\"), 1);\n        assert_eq!(manager.increment_count(\"key1\"), 2);\n\n        assert_eq!(manager.get_count(\"key1\"), 2);\n        assert_eq!(manager.get_count(\"key2\"), 1);\n    }\n\n    #[test]\n    fn test_cleanup_expired() {\n        let manager = StateManager::with_ttl(Duration::from_millis(100));\n\n        manager.increment_count(\"test1\");\n        manager.increment_count(\"test2\");\n\n        assert_eq!(manager.get_count(\"test1\"), 1);\n        assert_eq!(manager.get_count(\"test2\"), 1);\n\n        thread::sleep(Duration::from_millis(150));\n\n        manager.cleanup_expired();\n\n        assert_eq!(manager.get_count(\"test1\"), 0);\n        assert_eq!(manager.get_count(\"test2\"), 0);\n    }\n\n    #[test]\n    fn test_concurrent_access() {\n        use std::sync::Arc;\n        use std::thread;\n\n        let manager = Arc::new(StateManager::new());\n        let mut handles = vec![];\n\n        for i in 0..10 {\n            let manager = manager.clone();\n            handles.push(thread::spawn(move || {\n                for _ in 0..100 {\n                    manager.increment_count(\u0026format!(\"key{}\", i % 3));\n                }\n            }));\n        }\n\n        for handle in handles {\n            handle.join().unwrap();\n        }\n\n        assert!(\n            manager.get_count(\"key0\") \u003e 0\n                || manager.get_count(\"key1\") \u003e 0\n                || manager.get_count(\"key2\") \u003e 0\n        );\n    }\n}\n","traces":[{"line":49,"address":[],"length":0,"stats":{"Line":36}},{"line":50,"address":[],"length":0,"stats":{"Line":72}},{"line":53,"address":[],"length":0,"stats":{"Line":37}},{"line":55,"address":[],"length":0,"stats":{"Line":74}},{"line":60,"address":[],"length":0,"stats":{"Line":1011}},{"line":61,"address":[],"length":0,"stats":{"Line":2022}},{"line":63,"address":[],"length":0,"stats":{"Line":3033}},{"line":64,"address":[],"length":0,"stats":{"Line":2022}},{"line":65,"address":[],"length":0,"stats":{"Line":2022}},{"line":66,"address":[],"length":0,"stats":{"Line":1011}},{"line":68,"address":[],"length":0,"stats":{"L n writing, software\n * distributed under the License is distributed on an \"AS IS\" BASIS,\n * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n * See the License for the specific language governing permissions and\n * limitations under the License.\n */\n\nuse crate::config::Config;\nuse crate::rules::RuleEngine;\nuse crate::server::openapi::ApiDoc;\nuse crate::telemetry::tracer::tracing_middleware;\nuse actix_web::dev::Server;\nuse actix_web::http::header;\nuse actix_web::web;\nuse actix_web::App;\nuse actix_web::HttpResponse;\nuse actix_web::HttpServer;\nuse actix_web::Responder;\nuse std::sync::Arc;\nuse tracing::info;\nuse utoipa::OpenApi;\nuse utoipa_swagger_ui::{SwaggerUi, Url};\n\npub async fn run_server(config: Config, rule_engine: Arc\u003cRuleEngine\u003e) -\u003e anyhow::Result\u003cServer\u003e {\n    let server_config = config.server.clone();\n    let addr = format!(\"{}:{}\", server_config.host, server_config.port);\n\n    info!(\"Starting server on {}\", addr);\n    info!(\"Server workers: {}\", server_config.workers);\n    info!(\"Max request size: {} bytes\", server_config.max_request_size);\n\n    let openapi = ApiDoc::openapi();\n    let swagger_urls = vec![(Url::new(\"Molock API\", \"/api-docs/openapi.json\"), openapi)];\n\n    let server = HttpServer::new(move || {\n        let app_state = web::Data::new(AppState {\n            _config: config.clone(),\n            rule_engine: rule_engine.clone(),\n        });\n\n        App::new()\n            .wrap(tracing_middleware())\n            .app_data(app_state.clone())\n            .app_data(web::JsonConfig::default().limit(config.server.max_request_size))\n            .service(web::resource(\"/health\").to(crate::server::health_handler))\n            .service(web::resource(\"/metrics\").to(crate::server::metrics_handler))\n            .service(SwaggerUi::new(\"/swagger-ui/{_:.*}\").urls(swagger_urls.clone()))\n            .service(web::resource(\"/api-docs/openapi.json\").to(openapi_json_handler))\n            .default_service(web::to(crate::server::request_handler))\n    })\n    .workers(server_config.workers)\n    .bind(addr)?\n    .run();\n\n    Ok(server)\n}\n\nasync fn openapi_json_handler() -\u003e impl Responder {\n    let openapi = ApiDoc::openapi();\n    let json = serde_json::to_string(\u0026openapi).unwrap();\n    HttpResponse::Ok()\n        .insert_header(header::ContentType::json())\n        .body(json)\n}\n\n#[derive(Clone)]\npub struct AppState {\n    pub _config: Config,\n    pub rule_engine: Arc\u003cRuleEngine\u003e,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::types::{Endpoint, Response};\n    use std::collections::HashMap;\n\n    #[test]\n    fn test_app_state() {\n        let mut config = Config::default();\n        config.endpoints = vec![Endpoint {\n            name: \"Test\".to_string(),\n            method: \"GET\".to_string(),\n            path: \"/test\".to_string(),\n            stateful: false,\n            state_key: None,\n            responses: vec![Response {\n                status: 200,\n                delay: None,\n                body: Some(\"OK\".to_string()),\n                headers: HashMap::new(),\n                condition: None,\n                probability: None,\n                default: false,\n            }],\n            schema: None,\n            schema_file: None,\n            path_regex: None,\n            headers_regex: None,\n            query_regex: None,\n        }];\n\n        let rule_engine = Arc::new(RuleEngine::new(config.endpoints.clone()));\n        let app_state = AppState {\n            _config: config.clone(),\n            rule_engine: rule_engine.clone(),\n        };\n\n        assert_eq!(app_state._config.endpoints.len(), 1);\n        assert_eq!(app_state._config.endpoints[0].name, \"Test\");\n    }\n\n    #[actix_web::test]\n    async fn test_openapi_json_handler() {\n        let resp = openapi_json_handler()\n            .await\n
